<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onelife Competitive Map</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-container { background: #16213e; border-radius: 12px; padding: 40px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-width: 400px; width: 90%; text-align: center; }
.login-container h1 { font-size: 24px; margin-bottom: 8px; color: #fff; }
.login-container .subtitle { color: #8892b0; margin-bottom: 24px; font-size: 14px; }
.login-container .branding { color: #64ffda; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
input[type="password"] { width: 100%; padding: 12px 16px; border: 2px solid #233554; border-radius: 8px; background: #0a192f; color: #ccd6f6; font-size: 16px; outline: none; transition: border-color 0.3s; }
input[type="password"]:focus { border-color: #64ffda; }
button { width: 100%; padding: 12px; margin-top: 16px; border: none; border-radius: 8px; background: #64ffda; color: #0a192f; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
button:hover { background: #4cd6b0; }
.error { color: #ff6b6b; margin-top: 12px; font-size: 14px; display: none; }
.loading { display: none; margin-top: 16px; color: #8892b0; }
.loading.active { display: block; }
</style>
</head>
<body>
<div class="login-container">
  <div class="branding">Braff &amp; Co.</div>
  <h1>Competitive Map</h1>
  <p class="subtitle">Onelife Fitness &mdash; Competitive Landscape Analysis</p>
  <form onsubmit="return decrypt()">
    <input type="password" id="pw" placeholder="Enter password" autofocus>
    <button type="submit">Unlock</button>
  </form>
  <div class="error" id="err">Incorrect password. Try again.</div>
  <div class="loading" id="loading">Loading data&hellip;</div>
</div>
<script>
async function decrypt() {
  var pw = document.getElementById("pw").value;
  if (!pw) return false;
  document.getElementById("err").style.display = "none";
  var loadEl = document.getElementById("loading");
  loadEl.className = "loading active";

  try {
    loadEl.textContent = "Loading encrypted data\u2026";
    var parts = await Promise.all([
      fetch("d0.txt").then(r => r.text()),
      fetch("d1.txt").then(r => r.text()),
      fetch("d2.txt").then(r => r.text())
    ]);
    var b64 = parts.join("");

    loadEl.textContent = "Decrypting\u2026";
    var raw = Uint8Array.from(atob(b64), function(c) { return c.charCodeAt(0); });

    var salt = raw.slice(0, 16);
    var iv = raw.slice(16, 28);
    var ciphertext = raw.slice(28);

    var keyMaterial = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]
    );
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );

    var decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv },
      key,
      ciphertext
    );

    loadEl.textContent = "Decompressing\u2026";
    var ds = new DecompressionStream("gzip");
    var writer = ds.writable.getWriter();
    writer.write(new Uint8Array(decrypted));
    writer.close();
    var reader = ds.readable.getReader();
    var chunks = [];
    while (true) {
      var result = await reader.read();
      if (result.done) break;
      chunks.push(result.value);
    }
    var totalLen = chunks.reduce(function(a, c) { return a + c.length; }, 0);
    var combined = new Uint8Array(totalLen);
    var offset = 0;
    for (var i = 0; i < chunks.length; i++) {
      combined.set(chunks[i], offset);
      offset += chunks[i].length;
    }

    var html = new TextDecoder().decode(combined);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    loadEl.className = "loading";
    document.getElementById("err").style.display = "block";
    console.error("Decryption failed:", e);
  }
  return false;
}
</script>
</body>
</html>
