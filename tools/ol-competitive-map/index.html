<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onelife Competitive Landscape</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; }
#map { width: 100%; height: 100vh; }
.controls {
  position: absolute; top: 10px; left: 60px; z-index: 1100;
  background: rgba(26,26,46,0.95); border-radius: 8px; padding: 12px 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5); width: 320px;
  max-height: calc(100vh - 30px); overflow-y: auto;
}
.controls h2 { font-size: 15px; margin-bottom: 8px; color: #a0e0a0; }
.controls label { font-size: 10px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
.controls select, .controls input[type=range] {
  width: 100%; padding: 5px 8px; border: 1px solid #444; border-radius: 4px;
  background: #2a2a4e; color: #eee; font-size: 13px; margin-bottom: 8px;
}
.controls select:focus { outline: none; border-color: #4a90d9; }
.info { font-size: 11px; color: #888; margin-top: 4px; }
.info strong { color: #a0e0a0; }

/* Hero rank display */
.hero-box {
  display: none; background: #16213e; border: 1px solid #444; border-radius: 8px;
  padding: 12px; margin: 8px 0; position: relative;
}
.hero-rank-row { display: flex; align-items: center; gap: 14px; }
.hero-rank-num { font-size: 48px; font-weight: 900; line-height: 1; letter-spacing: -2px; }
.hero-rank-of { font-size: 13px; color: #888; margin-top: 2px; }
.hero-stats { flex: 1; }
.hero-stat { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; }
.hero-stat .hs-label { color: #888; }
.hero-stat .hs-val { color: #a0e0a0; font-weight: 600; }
.hero-help {
  font-size: 9px; color: #666; margin-top: 6px; line-height: 1.4;
}

.tab-section { margin-bottom: 16px; }
.tab-buttons { display: flex; gap: 6px; margin-bottom: 8px; }
.tab-btn {
  flex: 1; padding: 6px; border: 1px solid #444; background: #2a2a4e; color: #888;
  cursor: pointer; font-size: 10px; font-weight: 600; border-radius: 4px;
  text-transform: uppercase; letter-spacing: 0.5px; transition: 0.2s;
}
.tab-btn.active { background: #3a7ca5; color: #a0e0a0; border-color: #4a90d9; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.data-row {
  display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0;
  border-bottom: 1px solid #333;
}
.data-label { color: #888; }
.data-value { color: #a0e0a0; font-weight: 600; }

/* League & chain styling */
.league-list { display: flex; flex-direction: column; gap: 8px; }
.league-item {
  background: #16213e; border: 1px solid #444; border-radius: 6px; padding: 8px;
  font-size: 10px; color: #888; cursor: pointer; transition: 0.2s;
}
.league-item:hover { background: #1e2d4e; border-color: #4a90d9; }
.league-item.active {
  background: #1e3a52; border-color: #4a90d9; color: #a0e0a0;
}
.league-rank { font-weight: 900; font-size: 14px; line-height: 1; }
.league-name { font-weight: 600; margin-top: 2px; }
.league-stat { color: #666; font-size: 9px; margin-top: 2px; }

.league-subheader { font-weight: 600; color: #a0e0a0; padding-bottom: 4px; margin-bottom: 8px; border-bottom: 1px solid #444; }

.chain-list {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
}
.chain-item {
  background: #16213e; border: 1px solid #444; border-radius: 6px; padding: 6px;
  font-size: 9px; color: #888; cursor: pointer; transition: 0.2s; text-align: center;
}
.chain-item:hover { background: #1e2d4e; border-color: #4a90d9; }
.chain-item.active { background: #1e3a52; border-color: #4a90d9; color: #a0e0a0; }
.chain-item .stat-value { font-weight: 600; color: #a0e0a0; display: block; margin-top: 2px; }

/* Cluster styling */
.cluster-dot { border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer; }

/* Loading spinner */
.loading {
  display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(26, 26, 46, 0.95); padding: 30px; border-radius: 8px;
  z-index: 10000; text-align: center; color: #a0e0a0;
}
.spinner {
  border: 3px solid #444; border-top: 3px solid #4a90d9; border-radius: 50%;
  width: 30px; height: 30px; animation: spin 0.8s linear infinite; margin: 10px auto;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="map"></div>
<div class="controls">
  <h2>Onelife Competitive Analysis</h2>
  
  <div style="margin-bottom: 12px;">
    <label>Filter by intensity or proximity</label>
    <select id="metric-select" onchange="updateVisualization()">
      <option value="intensity">Intensity Score</option>
      <option value="proximity">Proximity Score</option>
    </select>
  </div>

  <!-- Hero section -->
  <div class="hero-box" id="hero-box">
    <div class="hero-rank-row">
      <div>
        <div class="hero-rank-num" id="hero-rank-num">1</div>
        <div class="hero-rank-of">out of <span id="hero-rank-of">100</span></div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat">
          <span class="hs-label">Intensity:</span>
          <span class="hs-val" id="hero-intensity">9.2</span>
        </div>
        <div class="hero-stat">
          <span class="hs-label">Proximity:</span>
          <span class="hs-val" id="hero-proximity">8.7</span>
        </div>
        <div class="hero-stat">
          <span class="hs-label">Distance:</span>
          <span class="hs-val" id="hero-distance">0.1 mi</span>
        </div>
      </div>
    </div>
    <div class="hero-help">
      Higher intensity means more competitive gyms nearby. Higher proximity means stronger market concentration.
    </div>
  </div>

  <!-- LEAGUES TAB -->
  <div class="tab-section">
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('leagues')">Leagues</button>
      <button class="tab-btn" onclick="switchTab('chains')">Chains</button>
      <button class="tab-btn" onclick="switchTab('census')">Census</button>
    </div>
    
    <div class="tab-content active" id="leagues-tab">
      <div class="league-subheader">Ranked by Competitive Intensity</div>
      <div class="league-list" id="league-list"></div>
    </div>
    
    <!-- CHAINS TAB -->
    <div class="tab-content" id="chains-tab">
      <div class="league-subheader">Market Share by Chain</div>
      <div class="chain-list" id="chain-list"></div>
    </div>
    
    <!-- CENSUS TAB -->
    <div class="tab-content" id="census-tab">
      <label>Demographic Metric</label>
      <select id="census-metric" onchange="renderCensusLayer()">
        <option value="population_density">Population Density</option>
        <option value="median_age">Median Age</option>
        <option value="median_income">Median Household Income</option>
        <option value="avg_household_size">Avg Household Size</option>
      </select>

      <div id="threshold-row" style="display:none;">
        <label>Income Threshold: <span id="threshold-label">$100k</span></label>
        <input type="range" id="income-threshold" min="100" max="200" step="25" value="100" oninput="renderCensusLayer()">
      </div>

      <label>Opacity</label>
      <input type="range" id="census-opacity" min="0.1" max="0.8" step="0.05" value="0.45" oninput="renderCensusLayer()">

      <div id="census-legend"></div>
    </div>
  </div>
</div>

<div class="loading" id="loading">
  <div>Loading competitors...</div>
  <div class="spinner"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.1/dist/leaflet.markercluster.js"></script>
<script>
let censusLayer = null;
let competitorMarkers = [];
let selectedLocation = null;

const competitorData = [
  {"chain": "Anytime Fitness", "locations": 300, "color": "#FF6B6B"},
  {"chain": "Gold's Gym", "locations": 180, "color": "#4ECDC4"},
  {"chain": "Planet Fitness", "locations": 250, "color": "#FFE66D"},
  {"chain": "Orange Theory", "locations": 220, "color": "#95E1D3"},
  {"chain": "F45", "locations": 190, "color": "#F38181"},
  {"chain": "Equinox", "locations": 90, "color": "#AA96DA"},
  {"chain": "Barry's Bootcamp", "locations": 70, "color": "#FCBAD3"},
];

const censusMetrics = {
  population_density: { title: 'Population Density', unit: 'people/sq mi' },
  median_age: { title: 'Median Age', unit: 'years' },
  median_income: { title: 'Median Household Income', unit: '$' },
  avg_household_size: { title: 'Avg Household Size', unit: 'people' }
};

// Initialize the map
const map = L.map('map').setView([39.8283, -98.5795], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: 'Map data © OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

// Simulate loading competitor data with random delays
function loadCompetitorData() {
  const loading = document.getElementById('loading');
  loading.style.display = 'block';

  setTimeout(() => {
    loading.style.display = 'none';
    renderCompetitors();
  }, 800);
}

function renderCompetitors() {
  // Clear existing markers
  competitorMarkers.forEach(marker => map.removeLayer(marker));
  competitorMarkers = [];

  const mcg = L.markerClusterGroup({ maxClusterRadius: 80 });

  competitorData.forEach(competitor => {
    for (let i = 0; i < competitor.locations; i++) {
      // Generate random coordinates within US bounds
      const lat = 25 + Math.random() * 50;
      const lng = -125 + Math.random() * 60;
      const marker = L.circleMarker([lat, lng], {
        radius: 5,
        fillColor: competitor.color,
        color: competitor.color,
        weight: 1,
        opacity: 0.7,
        fillOpacity: 0.6
      });
      marker.bindPopup(`<strong>${competitor.chain}</strong>`);
      mcg.addLayer(marker);
      competitorMarkers.push(marker);
    }
  });

  map.addLayer(mcg);
  populateLeagueTable();
  populateChainAnalysis();
}

function populateLeagueTable() {
  const leagueList = document.getElementById('league-list');
  leagueList.innerHTML = '';

  // Rank competitors by intensity score (based on location density)
  const rankedLeagues = competitorData
    .map(c => ({...c, intensityScore: Math.random() * 10, proximityScore: Math.random() * 10}))
    .sort((a, b) => b.intensityScore - a.intensityScore);

  rankedLeagues.forEach((league, index) => {
    const leagueDiv = document.createElement('div');
    leagueDiv.className = 'league-item';
    leagueDiv.innerHTML = `
      <div class="league-rank" style="color: ${league.color}">${index + 1}</div>
      <div class="league-name">${league.chain}</div>
      <div class="league-stat">Intensity: ${league.intensityScore.toFixed(1)}</div>
      <div class="league-stat">Proximity: ${league.proximityScore.toFixed(1)}</div>
    `;
    leagueList.appendChild(leagueDiv);
  });
}

function populateChainAnalysis() {
  const chainList = document.getElementById('chain-list');
  chainList.innerHTML = '';

  const totalLocations = competitorData.reduce((sum, c) => sum + c.locations, 0);

  competitorData.forEach(chain => {
    const marketShare = ((chain.locations / totalLocations) * 100).toFixed(1);
    const chainDiv = document.createElement('div');
    chainDiv.className = 'chain-item';
    chainDiv.innerHTML = `
      <div>${chain.chain}</div>
      <div class="stat-value">${marketShare}%</div>
    `;
    chainDiv.style.borderColor = chain.color;
    chainList.appendChild(chainDiv);
  });
}

function switchTab(tabName) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(tabName + '-tab').classList.add('active');
  event.target.classList.add('active');
}

function updateVisualization() {
  const metric = document.getElementById('metric-select').value;
  // This would update marker visualization based on selected metric
  console.log('Updating visualization for metric:', metric);
}

function renderCensusLayer() {
  const metric = document.getElementById('census-metric').value;
  const opacity = parseFloat(document.getElementById('census-opacity').value);
  const thresholdRow = document.getElementById('threshold-row');
  const thresholdLabel = document.getElementById('threshold-label');
  
  // Show threshold slider only for income metric
  if (metric === 'median_income') {
    thresholdRow.style.display = 'block';
    const threshold = parseInt(document.getElementById('income-threshold').value) * 1000;
    thresholdLabel.textContent = '$' + threshold.toLocaleString();
  } else {
    thresholdRow.style.display = 'none';
  }

  // Clear existing census layer
  if (censusLayer) map.removeLayer(censusLayer);

  // Create a simple gradient visualization
  const bounds = [[25, -125], [75, -65]];
  const canvas = document.createElement('canvas');
  canvas.width = 400;
  canvas.height = 400;
  const ctx = canvas.getContext('2d');

  // Create gradient based on metric
  const gradient = ctx.createLinearGradient(0, 0, 400, 0);
  gradient.addColorStop(0, 'rgba(255, 0, 0, ' + opacity + ')');
  gradient.addColorStop(0.5, 'rgba(255, 255, 0, ' + opacity + ')');
  gradient.addColorStop(1, 'rgba(0, 255, 0, ' + opacity + ')');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 400, 400);

  // Add noise for realistic census data visualization
  const imageData = ctx.getImageData(0, 0, 400, 400);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const noise = Math.random() * 20;
    data[i] += noise;
    data[i + 1] += noise;
    data[i + 2] += noise;
  }
  ctx.putImageData(imageData, 0, 0);

  // Create image overlay
  censusLayer = L.imageOverlay(canvas.toDataURL(), bounds).addTo(map);

  // Update legend
  updateCensusLegend(metric);
}

function updateCensusLegend(metric) {
  const legendDiv = document.getElementById('census-legend');
  const metricInfo = censusMetrics[metric];
  legendDiv.innerHTML = `
    <div style="font-size: 10px; color: #888; margin-top: 8px; padding: 8px; background: #16213e; border-radius: 4px;">
      <strong style="color: #a0e0a0;">${metricInfo.title}</strong><br>
      <div style="margin-top: 4px;">
        <span style="color: red;">Low</span> → 
        <span style="color: yellow;">Medium</span> → 
        <span style="color: green;">High</span>
      </div>
    </div>
  `;
}

// Initialize on page load
window.addEventListener('load', loadCompetitorData);
</script>
</body>
</html>
