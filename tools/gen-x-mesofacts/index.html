<style>
/* Layout: 1990 newspaper-infographic look. Heavy masthead rule, boxed nav, two-column grid of ruled boxes with colored headline bars; the first chart in each category runs full width with a callout column. Deliberately single-theme (newsprint), so every color is set explicitly. */
:root {
  --paper: #ffffff; --ink: #111111; --ink-2: #333333; --muted: #5c5c5c; --rule: #111111; --hair: rgba(17,17,17,0.12);
  --yellow: #ffc72c; --blue: #1f4e8c; --red: #c8102e;
  --c1: #2f63b0; --c2: #d97a00; --c3: #8e44ad; --c4: #2a8f5c; --c5: #b0902a;
  --fc: #c8102e; --dem: #2f63b0; --rep: #c8102e;
  --display: "Archivo Black", "Arial Black", "Helvetica Neue", sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
.mast { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; border-bottom: 8px solid var(--rule); padding-bottom: 10px; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(2.6rem, 6vw, 4.2rem); line-height: 0.95; letter-spacing: -0.02em; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 3px solid var(--rule); padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs button { font: inherit; font-weight: 800; font-size: 14px; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); padding: 4px 10px; cursor: pointer; white-space: nowrap; border-radius: 0; }
.tabs button.on { background: var(--ink); color: var(--paper); }
.filters { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 13px; }
.group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.group > span { font-weight: 800; margin-right: 4px; }
.chip { font: inherit; font-size: 13px; font-weight: 600; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); padding: 2px 8px; cursor: pointer; border-radius: 0; }
.chip.on { background: var(--yellow); }
.count { margin-left: auto; font-weight: 800; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.cat-h { font-family: var(--display); font-size: 28px; margin: 34px 0 12px; display: flex; align-items: baseline; gap: 12px; border-bottom: 3px solid var(--rule); padding-bottom: 4px; }
.cat-h small { font-family: var(--body); font-weight: 800; font-size: 14px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.card { border: 3px solid var(--rule); display: flex; flex-direction: column; min-width: 0; background: var(--paper); }
.card.hero, .card.wide { grid-column: 1 / -1; }
.bar { padding: 8px 14px; border-bottom: 3px solid var(--rule); }
.bar h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.15; text-wrap: balance; }
.hero .bar h3 { font-size: 30px; }
.bar.yellow { background: var(--yellow); color: var(--ink); }
.bar.blue { background: var(--blue); color: #ffffff; }
.bar.red { background: var(--red); color: #ffffff; }
.bar.black { background: var(--ink); color: #ffffff; }
.meta { padding: 8px 14px 0; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.meta b { font-weight: 800; color: var(--ink); }
.tag { font-size: 11px; font-weight: 800; border: 1px solid var(--ink); padding: 0 5px; }
.tag.maybe { background: var(--yellow); }
.body { display: flex; flex-direction: column; gap: 6px; padding: 8px 14px 6px; min-width: 0; }
.hero .body { flex-direction: row; padding: 0; }
.callouts { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.hero .callouts { flex-direction: column; flex-wrap: nowrap; gap: 16px; width: 210px; flex-shrink: 0; border-right: 3px solid var(--rule); padding: 16px; box-sizing: border-box; }
.co .n { font-family: var(--display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.hero .co .n { font-size: 46px; }
.co .l { font-size: 12px; font-weight: 800; color: var(--ink-2); }
.co.first .n { color: var(--ink); } .co.last .n { color: var(--blue); } .co.fc .n { color: var(--fc); }
.chartbox { flex: 1; min-width: 0; }
.hero .chartbox { padding: 12px 14px 8px; }
.chart { position: relative; height: 240px; }
.hero .chart { height: 300px; }
.multiples { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px 14px; padding: 12px 14px; }
.mini .st { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; border-bottom: 2px solid var(--rule); margin-bottom: 4px; }
.mini .chart { height: 100px; }
.foot { border-top: 3px solid var(--rule); padding: 6px 14px; font-size: 12px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: space-between; margin-top: auto; }
details summary { cursor: pointer; font-weight: 800; }
details p { margin: 6px 0 2px; font-weight: 400; line-height: 1.45; max-width: 70ch; }
.key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; font-weight: 600; align-items: center; }
.key i { display: inline-block; width: 22px; height: 0; border-top: 3px dashed var(--fc); vertical-align: middle; margin-right: 6px; }
.key s { display: inline-block; width: 0; height: 14px; border-left: 2px dashed var(--muted); vertical-align: middle; margin-right: 6px; text-decoration: none; }
.empty { padding: 40px 0; font-weight: 800; }
@media (max-width: 760px) {
  .grid { grid-template-columns: 1fr; }
  .hero .body { flex-direction: column; }
  .hero .callouts { width: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 3px solid var(--rule); }
  .hero .co .n { font-size: 32px; }
  .hero .bar h3 { font-size: 24px; }
  .multiples { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .count { margin-left: 0; }
}
</style>
</head>

4.8973],[1979.0,4.9088],[1980.0,4.7302],[1981.0,4.5436],[1982.0,4.3119],[1983.0,4.3464],[1984.0,4.4794],[1985.0,4.4954],[1986.0,4.4981],[1987.0,4.6919],[1988.0,4.8978],[1989.0,4.9602],[1990.0,5.1318],[1991.0,5.0764],[1992.0,5.1788],[1993.0,5.2795],[1994.0,5.3619],[1995.0,5.4258],[1996.0,5.6011],[1997.0,5.6731],[1998.0,5.7364],[1999.0,5.8003],[2000.0,6.0232],[2001.0,5.9036],[2002.0,5.9478],[2003.0,6.0064],[2004.0,6.1116],[2005.0,6.1269],[2006.0,6.0453],[2007.0,6.1215],[2008.0,5.9192],[2009.0,5.4861],[2010.0,5.6692],[2011.0,5.539],[2012.0,5.3315],[2013.0,5.4734],[2014.0,5.5314],[2015.0,5.3685],[2016.0,5.2454],[2017.0,5.1954],[2018.0,5.3612],[2019.0,5.2359],[2020.0,4.6899],[2021.0,5.0201],[2022.0,5.0554],[2023.0,4.9184],[2024.0,4.9041]]}],"shape":"R","src":"Global Carbon Project via OWID","maybe":false,"fmt":"2","kind":"line","notes":"2025 not yet in file.","head":"US carbon emissions peaked in 2005 and are down 20%","fc":{"series":0,"a":-266.32715714285723,"b":0.13640571428571432,"v2025":9.8944,"txt":null}}]};
const SHAPES = { R: "Reversal", P: "Plateau", S: "Slow drift", D: "Double flip" };
const state = { cat: "All", shapes: new Set(), range: 1970, trend: false };
const charts = new Map();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PAL = () => ["--c1", "--c2", "--c3", "--c4", "--c5"].map(css);
const yr = x => String(Math.round(x));
const BAR = ["blue", "red", "black"];
function fmt(v, d) {
  const n = Number(d);
  return v.toLocaleString("en-US", { minimumFractionDigits: n, maximumFractionDigits: n, useGrouping: Math.abs(v) >= 10000 || n === 0 });
}

function visibleCards() {
  return DATA.cards.filter(c =>
    (state.cat === "All" || c.cat === state.cat) &&
    (!state.shapes.size || state.shapes.has(c.shape)));
}

function callouts(c) {
  if (c.kind === "multiples") return "";
  const s = c.series[0];
  const pts = s.pts.filter(p => p[0] >= state.range);
  if (pts.length < 2) return "";
  const first = pts[0], last = pts[pts.length - 1];
  let pk = pts[0], lo = pts[0];
  pts.forEach(p => { if (p[1] > pk[1]) pk = p; if (p[1] < lo[1]) lo = p; });
  const an = c.anchor && s.pts.find(p => Math.round(p[0]) === c.anchor);
  const ext = an ? [an, an === pk ? "peak" : ""] : (pk !== first && pk !== last) ? [pk, "peak"] : (lo !== first && lo !== last) ? [lo, "low"] : [first, ""];
  const who = c.series.length > 1 ? `${s.label}, ` : "";
  let h = `<div class="co first"><div class="n">${fmt(ext[0][1], c.fmt)}</div><div class="l">${esc(who)}${yr(ext[0][0])}${ext[1] ? ", " + ext[1] : ""}</div></div>`;
  h += `<div class="co last"><div class="n">${fmt(last[1], c.fmt)}</div><div class="l">${esc(who)}${yr(last[0])}</div></div>`;
  if (c.fc && state.trend) {
    const fs = c.series[c.fc.series];
    const fwho = c.series.length > 1 ? fs.label + ", " : "";
    let n, l;
    if (c.fc.txt) {
      const [what, year] = c.fc.txt.split(" by ");
      n = what === "zero" ? "0" : "100%";
      l = `${fwho}${year} on the 1990 trend`;
    } else { n = fmt(c.fc.v2025, c.fmt); l = `${fwho}2025 on the 1990 trend`; }
    h += `<div class="co fc"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`;
  }
  return h;
}

function cardHTML(c, hero, idx) {
  const wide = c.kind === "multiples";
  const color = hero ? "yellow" : BAR[idx % 3];
  const body = wide
    ? `<div class="multiples">${c.series.map((s, i) => `<div class="mini"><div class="st"><span>${esc(s.label)}</span><span id="ms-${c.id}-${i}"></span></div><div class="chart"><canvas id="cv-${c.id}-${i}" role="img" aria-label="${esc(s.label)} partisan lean relative to the nation, 1976 to 2024"></canvas></div></div>`).join("")}</div>`
    : `<div class="body"><div class="callouts">${callouts(c)}</div><div class="chartbox"><div class="chart"><canvas id="cv-${c.id}" role="img" aria-label="${esc(c.title)}, ${esc(c.unit)}"></canvas></div></div></div>`;
  return `<article class="card${hero && !wide ? " hero" : ""}${wide ? " wide" : ""}" data-id="${c.id}">
    <div class="bar ${color}"><h3>${esc(c.head)}</h3></div>
    <div class="meta"><span><b>${esc(c.title)}</b>, ${esc(c.unit.charAt(0).toLowerCase() + c.unit.slice(1))}</span><span class="tag" title="Curve shape">${SHAPES[c.shape]}</span></div>
    ${body}
    <div class="foot"><span>Source: ${esc(c.src)}</span>${c.notes ? `<details><summary>Notes</summary><p>${esc(c.notes)}</p></details>` : ""}</div>
  </article>`;
}

function render() {
  charts.forEach(ch => ch.destroy()); charts.clear();
  const cards = visibleCards();
  if (!cards.length) { $("list").innerHTML = `<div class="empty">No charts match these filters.</div>`; return; }
  let html = "";
  DATA.cats.forEach(cat => {
    const cs = cards.filter(c => c.cat === cat);
    if (!cs.length) return;
    html += `<h2 class="cat-h">${esc(cat)}</h2><div class="grid">`;
    let k = 0;
    cs.forEach((c, i) => { html += cardHTML(c, i === 0, i === 0 ? 0 : k++); });
    html += "</div>";
  });
  $("list").innerHTML = html;
  observe();
}

let io;
function observe() {
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    draw(DATA.cards.find(c => c.id === e.target.dataset.id));
  }), { rootMargin: "400px" });
  document.querySelectorAll(".card").forEach(el => io.observe(el));
}

const overlay = {
  id: "overlay",
  afterDatasetsDraw(chart, args, opts) {
    const { ctx, chartArea: a, scales: { x } } = chart;
    if (state.trend && opts.labels && x.min <= 1990 && x.max >= 1990) {
      const px = x.getPixelForValue(1990);
      ctx.save(); ctx.strokeStyle = css("--muted"); ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); ctx.restore();
    }
    if (!opts.labels) return;
    const placed = [];
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden || !ds.isFc) return;
      const pts = meta.data.filter((p, j) => ds.data[j] && ds.data[j].y != null && p.y >= a.top - 1 && p.y <= a.bottom + 1 && p.x <= a.right + 1);
      const p = pts[pts.length - 1]; if (!p) return;
      let y = p.y + (ds.isFc ? 12 : -12);
      placed.forEach(q => { if (Math.abs(q - y) < 14) y = q + (y >= q ? 14 : -14); });
      y = Math.max(a.top + 7, Math.min(a.bottom - 7, y));
      placed.push(y);
      ctx.save(); ctx.font = "800 12px " + css("--body"); ctx.textAlign = "right"; ctx.textBaseline = "middle";
      const label = ds.label.length > 28 ? ds.label.slice(0, 27) + "…" : ds.label;
      const w = ctx.measureText(label).width;
      const lx = Math.min(p.x - 4, a.right - 2);
      ctx.fillStyle = "rgba(255,255,255,0.88)"; ctx.fillRect(lx - w - 3, y - 8, w + 6, 16);
      ctx.fillStyle = ds.isFc ? css("--fc") : css("--ink"); ctx.fillText(label, lx, y); ctx.restore();
    });
  }
};

function niceRange(lo, hi, zero) {
  if (zero && lo > 0) lo = 0;
  const span = (hi - lo) || Math.abs(hi) || 1;
  const raw = span / 5, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  return { min: Math.floor(lo / step) * step, max: Math.ceil((hi + span * 0.04) / step) * step, step };
}

function trendPts(c) {
  const pct = c.unit.trim().startsWith("%");
  const out = [];
  for (let y = 1985; y <= 2025.001; y += 0.25) {
    let v = c.fc.a + c.fc.b * y;
    if (v < 0) { out.push({ x: (0 - c.fc.a) / c.fc.b, y: 0 }); break; }
    if (pct && v > 100) { out.push({ x: (100 - c.fc.a) / c.fc.b, y: 100 }); break; }
    out.push({ x: y, y: v });
  }
  return out;
}

function draw(c) {
  if (!c || typeof Chart === "undefined") return;
  const minX = state.range === 0 ? Math.floor(Math.min(...c.series.flatMap(s => s.pts.map(p => p[0]))) / 10) * 10 : state.range;
  if (c.kind === "multiples") return drawMultiples(c);
  const pal = PAL(), ink = css("--ink"), hair = css("--hair"), body = css("--body");
  const single = c.series.length === 1;
  const sp = c.series[0].pts;
  const area = single && c.kind !== "dot" && sp.length >= 25 && sp[0][0] <= Math.max(minX, 1972) && sp[sp.length - 1][0] >= 2020 && sp.every(p => p[1] >= 0);
  const showFc = state.trend && c.fc;
  const fc = showFc ? trendPts(c) : [];
  const vis = c.series.flatMap(s => s.pts.filter(p => p[0] >= minX).map(p => p[1])).concat(fc.map(p => p.y));
  const r = niceRange(Math.min(...vis), Math.max(...vis), single || Math.min(...vis) < 0);
  const ds = c.series.map((s, i) => {
    const sparse = s.pts.length < 30 || c.kind === "dot";
    return {
      label: s.label, data: s.pts.map(p => ({ x: p[0], y: p[1] })), borderColor: pal[i % 5],
      backgroundColor: area ? pal[0] + "e6" : pal[i % 5], fill: area ? "origin" : false,
      borderWidth: area ? 0 : 3, tension: 0, spanGaps: true, showLine: c.kind !== "dot",
      segment: area ? undefined : { borderDash: ctx => (ctx.p1.parsed.x - ctx.p0.parsed.x > 4 ? [3, 4] : undefined) },
      pointRadius: area ? 0 : (sparse ? 4 : 0), pointBackgroundColor: pal[i % 5], pointBorderColor: "#ffffff", pointBorderWidth: 1.5, pointHoverRadius: 6
    };
  });
  if (showFc) ds.push({ label: "1990 trend", data: fc, isFc: true, borderColor: css("--fc"), borderWidth: 3, borderDash: [7, 5], pointRadius: 0, pointHoverRadius: 0, fill: false, tension: 0 });
  const multi = c.series.length > 1;
  const ch = new Chart($("cv-" + c.id), {
    type: "line", data: { datasets: ds }, plugins: [overlay],
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "nearest", axis: "x", intersect: false },
      layout: { padding: { top: 6, right: 6 } },
      scales: {
        x: { type: "linear", min: minX, max: 2026, grid: { display: false }, border: { color: ink, width: 3 },
             ticks: { color: ink, font: { family: body, weight: 600, size: 12 }, stepSize: 10, callback: v => v % 10 === 0 ? String(v) : "" } },
        y: { min: r.min, max: r.max, grid: { color: ctx => ctx.tick.value === 0 && r.min < 0 ? ink : hair, drawTicks: false }, border: { display: false },
             ticks: { color: ink, font: { family: body, weight: 600, size: 11 }, stepSize: r.step, padding: 6, callback: v => (Math.abs(v) < 1e-9 ? 0 : v).toLocaleString("en-US") } }
      },
      plugins: {
        legend: { display: multi, position: "top", align: "start",
                  labels: { color: ink, font: { family: body, weight: 800, size: 12 }, boxWidth: 14, boxHeight: 3, padding: 10, filter: it => it.text !== "1990 trend" } },
        tooltip: { backgroundColor: "#111111", titleColor: "#ffffff", bodyColor: "#ffffff", titleFont: { family: body, weight: 800 }, bodyFont: { family: body },
                   cornerRadius: 0, padding: 8, displayColors: multi, boxWidth: 8, boxHeight: 8,
                   filter: it => !it.dataset.isFc,
                   callbacks: { title: items => items.length ? yr(items[0].parsed.x) : "", label: it => ` ${it.dataset.label}: ${fmt(it.parsed.y, c.fmt)}` } },
        overlay: { labels: !!showFc }
      }
    }
  });
  charts.set(c.id, ch);
}

function drawMultiples(c) {
  const dem = css("--dem"), rep = css("--rep"), ink = css("--ink"), body = css("--body");
  c.series.forEach((s, i) => {
    const last = s.pts[s.pts.length - 1];
    $(`ms-${c.id}-${i}`).textContent = (last[1] >= 0 ? "D+" : "R+") + Math.abs(last[1]).toFixed(0);
    const ch = new Chart($(`cv-${c.id}-${i}`), {
      type: "bar",
      data: { labels: s.pts.map(p => yr(p[0])), datasets: [{ label: s.label, data: s.pts.map(p => p[1]),
        backgroundColor: s.pts.map(p => p[1] >= 0 ? dem : rep), borderRadius: 0, barPercentage: 0.85, categoryPercentage: 0.9 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        scales: {
          x: { grid: { display: false }, border: { display: false },
               ticks: { color: ink, font: { family: body, weight: 600, size: 10 }, maxRotation: 0, autoSkip: false, callback: (v, j) => (j === 0 || j === s.pts.length - 1) ? "'" + yr(s.pts[j][0]).slice(2) : "" } },
          y: { min: -50, max: 50, grid: { color: ctx => ctx.tick.value === 0 ? ink : "transparent", lineWidth: 2 }, border: { display: false }, ticks: { display: false, stepSize: 50 } }
        },
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: "#111111", titleColor: "#ffffff", bodyColor: "#ffffff", cornerRadius: 0, displayColors: false,
                     callbacks: { label: it => `${s.label}: ${it.parsed.y >= 0 ? "D" : "R"}+${Math.abs(it.parsed.y).toFixed(1)} vs. nation` } } }
      }
    });
    charts.set(c.id + "-" + i, ch);
  });
}

function controls() {
  const cats = ["All", ...DATA.cats];
  $("tabs").innerHTML = cats.map(c => `<button role="tab" aria-selected="${state.cat === c}" class="${state.cat === c ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  $("shapes").innerHTML = "<span>Shape</span>" + Object.entries(SHAPES).map(([k, v]) => `<button class="chip ${state.shapes.has(k) ? "on" : ""}" data-shape="${k}" aria-pressed="${state.shapes.has(k)}">${v}</button>`).join("");
  $("range").innerHTML = "<span>Years</span>" + [[1970, "Since 1970"], [0, "Full history"]].map(([v, l]) => `<button class="chip ${state.range === v ? "on" : ""}" data-range="${v}" aria-pressed="${state.range === v}">${l}</button>`).join("");
  $("trend").innerHTML = "<span>1990 trend</span>" + [[false, "Off"], [true, "On"]].map(([v, l]) => `<button class="chip ${state.trend === v ? "on" : ""}" data-trend="${v}" aria-pressed="${state.trend === v}">${l}</button>`).join("");
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-cat],[data-shape],[data-range],[data-trend]");
  if (!t) return;
  if (t.dataset.cat) state.cat = t.dataset.cat;
  else if (t.dataset.shape) { const k = t.dataset.shape; state.shapes.has(k) ? state.shapes.delete(k) : state.shapes.add(k); }
  else if (t.dataset.range != null) state.range = Number(t.dataset.range);
  else state.trend = t.dataset.trend === "true";
  controls(); render();
});

controls(); render();
document.fonts?.ready?.then(() => { charts.forEach(ch => ch.update()); });
</script>
