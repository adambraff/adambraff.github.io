<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>March Madness 2026 Bracket Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8f8f8;color:#333;overflow:hidden;height:100vh}
.top-bar{background:#1a1a2e;color:#fff;padding:6px 20px;display:flex;align-items:center;justify-content:space-between;height:42px}
.top-bar h1{font-size:16px;font-weight:600;letter-spacing:.5px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:nowrap}
.ctrl{display:flex;align-items:center;gap:4px;font-size:11px}
.ctrl label{color:#aaa;white-space:nowrap;cursor:help;border-bottom:1px dotted #666;position:relative}
.ctrl label:hover .ltip{display:block}
.ctrl label .ltip{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);background:#222;color:#eee;padding:8px 10px;border-radius:4px;font-size:11px;line-height:1.4;white-space:normal;width:220px;z-index:200;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.5);margin-top:6px;font-weight:400;text-align:left}
.ctrl label .ltip::after{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:#222}
.ctrl input[type=range]{width:60px;height:4px;-webkit-appearance:none;background:#444;border-radius:2px;outline:none}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#4fc3f7;cursor:pointer}
.ctrl span{color:#4fc3f7;font-weight:600;min-width:22px;text-align:right}
.ctrl select{background:#333;color:#fff;border:1px solid #555;border-radius:3px;padding:2px 4px;font-size:11px;font-family:inherit}
.wsum{color:#f7dc6f;font-size:11px;font-weight:600}
.wsum.warn{color:#e74c3c}
button.reset{background:#444;color:#ccc;border:none;border-radius:3px;padding:3px 8px;font-size:10px;cursor:pointer}
button.reset:hover{background:#666}

.bracket-wrap{display:flex;height:calc(100vh - 42px);padding:4px}

/* Each half: two regions stacked vertically, rounds flow inward */
.half{flex:1;display:flex;flex-direction:column;overflow:hidden;gap:2px}
.half .rounds{flex-direction:row}
.half.right .region-block .rounds{flex-direction:row-reverse}
.half.right .team{flex-direction:row-reverse}
.half.right .team .sd{margin-right:0;margin-left:3px}
.half.right .team .tip{left:auto;right:100%}

.region-block{display:flex;flex-direction:column;position:relative;flex:1}
.region-block .rlabel{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;color:#fff;border-radius:2px;text-align:center;flex-shrink:0}

.rounds{display:flex;flex:1}
.round{display:flex;flex-direction:column;justify-content:space-around;padding:0 1px}

.game{display:flex;flex-direction:column;justify-content:center;margin:1px 0}
.team{display:flex;align-items:center;padding:2px 4px;font-size:10px;line-height:1.2;min-width:110px;max-width:140px;background:#fff;border:1px solid #ddd;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;height:18px}
.team:first-child{border-bottom:none;border-radius:2px 2px 0 0}
.team:last-child{border-radius:0 0 2px 2px}
.team .sd{font-weight:700;margin-right:3px;min-width:14px;color:#666;font-size:9px}
.team .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.team .sc{font-size:8px;color:#999;margin-left:3px}
.team.w{background:#e8f5e9;font-weight:600;border-color:#a5d6a7}
.team.l{color:#bbb;background:#fafafa}
.team.fav{border-left:3px solid #1565c0;background:#e3f2fd}
.team.fav.w{background:#bbdefb;border-color:#1565c0}
.team:hover{z-index:10}
.team .tip{display:none;position:absolute;left:100%;top:-10px;background:#222;color:#fff;padding:8px;border-radius:4px;font-size:10px;line-height:1.5;white-space:pre;z-index:100;min-width:180px;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.team:hover .tip{display:block}

/* Final Four center column */
.ff-col{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:160px;gap:0;padding:0 6px}
.ff-game{display:flex;flex-direction:column;margin:4px 0}
.ff-team{padding:4px 8px;font-size:11px;min-width:140px;background:#fff;border:1px solid #ddd;display:flex;align-items:center;gap:4px;height:22px}
.ff-team:first-child{border-bottom:none;border-radius:3px 3px 0 0}
.ff-team:last-child{border-radius:0 0 3px 3px}
.ff-team.w{background:#e8f5e9;font-weight:700;border-color:#66bb6a}
.ff-team.l{color:#bbb}
.ff-team.fav{border-left:3px solid #1565c0;background:#e3f2fd}
.ff-team.fav.w{background:#bbdefb}
.ff-team .sd{font-weight:700;min-width:16px;color:#555;font-size:10px}
.champ-box{margin:8px 0;padding:8px 12px;background:linear-gradient(135deg,#ffd700,#ffb300);border-radius:6px;text-align:center;font-weight:700;font-size:14px;color:#1a1a2e;box-shadow:0 2px 8px rgba(255,179,0,.4);min-width:150px}
.champ-box .champ-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#5d4037;margin-bottom:2px}
.champ-box .champ-score{font-size:11px;font-weight:400;color:#5d4037;margin-top:2px}
.ff-label{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px;margin:4px 0 2px}

/* Region colors */
.east .rlabel{background:#1565c0}
.south .rlabel{background:#c62828}
.west .rlabel{background:#2e7d32}
.midwest .rlabel{background:#e65100}
.east .team.w,.east .ff-team.w{border-color:#64b5f6}
.south .team.w,.south .ff-team.w{border-color:#ef9a9a}
.west .team.w,.west .ff-team.w{border-color:#81c784}
.midwest .team.w,.midwest .ff-team.w{border-color:#ffb74d}
</style>
</head>
<body>
<div class="top-bar">
  <h1>March Madness 2026 Bracket Builder</h1>
  <div class="controls">
    <div class="ctrl"><label>Elo<span class="ltip"><b>COOPER Elo</b> (Nate Silver) &mdash; Power rating based on game results, margin of victory, and opponent strength. Updated after every game. Higher = stronger team overall. Scale: ~1300 (worst) to ~2300 (best).</span></label><input type="range" id="sElo" min="0" max="100" value="40"><span id="vElo">40</span></div>
    <div class="ctrl"><label>SRS<span class="ltip"><b>Simple Rating System</b> (Sports Reference) &mdash; Average margin of victory adjusted for strength of schedule. Zero = average D-I team. +20 = elite. Combines offense and defense into one number.</span></label><input type="range" id="sSrs" min="0" max="100" value="25"><span id="vSrs">25</span></div>
    <div class="ctrl"><label>NRtg<span class="ltip"><b>Net Rating</b> (Sports Reference) &mdash; Offensive efficiency minus defensive efficiency, per 100 possessions. Measures how much better a team scores than it allows, tempo-independent. +30 = elite.</span></label><input type="range" id="sNrtg" min="0" max="100" value="20"><span id="vNrtg">20</span></div>
    <div class="ctrl"><label>Mom<span class="ltip"><b>Momentum</b> &mdash; Recent Elo change (current Elo minus prior). Positive = team is peaking. Negative = slumping. Only positive momentum counts here (slumps get zero weight, not penalty).</span></label><input type="range" id="sMom" min="0" max="100" value="10"><span id="vMom">10</span></div>
    <div class="ctrl"><label>Peak<span class="ltip"><b>Peak Proximity</b> &mdash; Current Elo divided by season-max Elo. Measures how close the team is to its best form this season. 1.0 = at peak right now. 0.9 = 10% below their best.</span></label><input type="range" id="sPeak" min="0" max="100" value="5"><span id="vPeak">5</span></div>
    <div class="wsum" id="wsum">=100%</div>
    <div class="ctrl"><label>O/D<span class="ltip"><b>Offense vs Defense bias</b> &mdash; Center = balanced. Slide right to favor high-ORtg (scoring) teams. Slide left to favor low-DRtg (lockdown defense) teams. Adds up to &plusmn;15% composite bonus at the extremes.</span></label><input type="range" id="sOD" min="-100" max="100" value="0"><span id="vOD">0</span></div>
    <div class="ctrl"><label>Chaos<span class="ltip"><b>Chaos / Upset factor</b> &mdash; Adds random noise to every team's score. Higher = more upsets. Click "Roll" to re-randomize. The bracket won't change until you click the button, so you can try different seeds.</span></label><input type="range" id="sChaos" min="0" max="100" value="0"><span id="vChaos">0</span><button class="reset" id="rollBtn" style="background:#e65100;color:#fff;margin-left:2px">Roll</button></div>
    <div class="ctrl"><label>Fav<span class="ltip"><b>Favorite Team Bonus</b> &mdash; Adds a loyalty boost to your chosen team's composite score. The slider sets bonus magnitude. For when the heart overrules the spreadsheet.</span></label>
      <select id="favTeam"><option value="">(None)</option></select>
      <input type="range" id="sBonus" min="0" max="200" value="50"><span id="vBonus">50</span>
    </div>
    <button class="reset" id="resetBtn">Reset</button>
  </div>
</div>

// Populate fav dropdown
const favSel=document.getElementById('favTeam');
const names=[];

// Chaos noise map: team name -> random value (-1 to 1), only regenerated on Roll click
let chaosMap={};
function rollChaos(){
  chaosMap={};
  Object.values(T).forEach(r=>r.forEach(t=>{chaosMap[t.n]=(Math.random()*2-1)}));
}

function readW(){
  W.elo=+sl.elo.value;W.srs=+sl.srs.value;W.nrtg=+sl.nrtg.value;W.mom=+sl.mom.value;W.peak=+sl.peak.value;W.bonus=+sl.bonus.value;W.fav=favSel.value;W.od=+sl.od.value;W.chaos=+sl.chaos.value;
  vd.elo.textContent=W.elo;vd.srs.textContent=W.srs;vd.nrtg.textContent=W.nrtg;vd.mom.textContent=W.mom;vd.peak.textContent=W.peak;vd.bonus.textContent=W.bonus;
  vd.od.textContent=(W.od>0?'+':'')+W.od;vd.chaos.textContent=W.chaos;
  const s=W.elo+W.srs+W.nrtg+W.mom+W.peak;const ws=document.getElementById('wsum');ws.textContent='='+s+'%';ws.classList.toggle('warn',s!==100);
}
// Weight sliders and O/D slider update live
['elo','srs','nrtg','mom','peak','bonus','od'].forEach(k=>sl[k].addEventListener('input',()=>{readW();render()}));

function comp(t){
  let c=((t.elo/2300)*W.elo+(t.srs/35)*W.srs+(t.nrtg/45)*W.nrtg+(Math.max(t.mom,0)/50)*W.mom+(t.elo/t.mx)*W.peak)/100;
  // Offense vs Defense bias: od ranges -100 to +100
  // Positive = favor offense (high ORtg), Negative = favor defense (low DRtg = good)
  if(W.od!==0){
    const odFactor=W.od/100; // -1 to +1
    // ORtg bonus: higher ORtg is better (scale ~95-135, center ~115)
    // DRtg bonus: lower DRtg is better (scale ~80-110, center ~95), so invert
    const offBonus=((t.ortg-115)/20)*0.15; // ~-0.15 to +0.15
    const defBonus=((95-t.drtg)/15)*0.15;  // ~-0.15 to +0.15
    if(odFactor>0) c+=offBonus*odFactor;
    else c+=defBonus*(-odFactor);
  }
  // Favorite bonus
  if(W.fav&&t.n===W.fav)c+=W.bonus/2300;
  // Chaos noise (only applied if chaos > 0)
  if(W.chaos>0&&chaosMap[t.n]!==undefined){
    c+=chaosMap[t.n]*(W.chaos/100)*0.25; // max noise: \u00b10.25 at chaos=100
  }
  return c;
}

function tip(t){
  const sc=comp(t);
  return `${t.n} (${t.c})\nElo: ${t.elo.toFixed(1)}  Mom: ${t.mom>0?'+':''}${t.mom.toFixed(1)}\nSRS: ${t.srs.toFixed(1)}  NRtg: ${t.nrtg.toFixed(1)}\nRecord: ${t.w}-${t.l}\nPPG: ${t.ppg} / Opp: ${t.oppg}\nORtg: ${t.ortg}  DRtg: ${t.drtg}\nScore: ${(sc*100).toFixed(1)}`;
}

function teamEl(t,won,lost){
  const isFav=W.fav&&t.n===W.fav;
  const cls=['team'];
  if(won)cls.push('w');if(lost)cls.push('l');if(isFav)cls.push('fav');
  const sc=comp(t);
  return `<div class="${cls.join(' ')}"><span class="sd">${t.s}</span><span class="nm">${t.n}</span><div class="tip">${tip(t)}</div></div>`;
}

function predictScore(a,b){
  // Team PPG weighted by opponent's defensive strength (opp's oppg relative to avg)
  const avgPPG=74;
  const aOff=a.ppg*(b.oppg/avgPPG);
  const bOff=b.ppg*(a.oppg/avgPPG);
  // Adjust by composite advantage
  const ca=comp(a),cb=comp(b);
  const edge=(ca-cb)*15; // composite diff scaled to points
  let sa=Math.round(aOff+edge/2), sb=Math.round(bOff-edge/2);
  // No ties in basketball \u2014 winner (team a = champ) gets +1 if tied
  if(sa===sb) sa+=1;
  return {a:sa,b:sb};
}

function simRegion(teams){
  let cur=[...teams];
  const rounds=[cur];
  while(cur.length>1){
    const next=[];
    for(let i=0;i<cur.length;i+=2){
      const a=cur[i],b=cur[i+1];
      next.push(comp(a)>=comp(b)?a:b);
    }
    rounds.push(next);
    cur=next;
  }
  return rounds;
}

function makeRoundCol(teams,winners,regionCls,reverse){
  const col=document.createElement('div');
  col.className='round';
  for(let i=0;i<teams.length;i+=2){
    const a=teams[i],b=teams[i+1];
    const aWon=winners?winners.includes(a):false;
    const bWon=winners?winners.includes(b):false;
    const g=document.createElement('div');
    g.className='game';
    g.innerHTML=teamEl(a,aWon,bWon)+teamEl(b,bWon,aWon);
    col.appendChild(g);
  }
  return col;
}

function render(){
  const wrap=document.getElementById('bracketWrap');
  wrap.innerHTML='';

  const regions={EAST:simRegion(T.EAST),SOUTH:simRegion(T.SOUTH),WEST:simRegion(T.WEST),MIDWEST:simRegion(T.MIDWEST)};

  // LEFT HALF: East on far left, South inside
  const leftHalf=document.createElement('div');leftHalf.className='half left';

  // Build region columns function
  function buildRegion(name,rounds,cls,reverse){
    const block=document.createElement('div');block.className='region-block '+cls;
    const label=document.createElement('div');label.className='rlabel';label.textContent=name;

    const roundsDiv=document.createElement('div');roundsDiv.className='rounds';

    for(let r=0;r<rounds.length-1;r++){
      const col=makeRoundCol(rounds[r],rounds[r+1]?rounds[r+1]:null,cls,reverse);
      roundsDiv.appendChild(col);
    }

    block.appendChild(label);
    block.appendChild(roundsDiv);
    return block;
  }

  leftHalf.appendChild(buildRegion('EAST',regions.EAST,'east',false));
  leftHalf.appendChild(buildRegion('SOUTH',regions.SOUTH,'south',false));

  // RIGHT HALF: Midwest far right, West inside
  const rightHalf=document.createElement('div');rightHalf.className='half right';
  rightHalf.appendChild(buildRegion('WEST',regions.WEST,'west',true));
  rightHalf.appendChild(buildRegion('MIDWEST',regions.MIDWEST,'midwest',true));

  // FINAL FOUR center
  const eastChamp=regions.EAST[regions.EAST.length-1][0];
  const southChamp=regions.SOUTH[regions.SOUTH.length-1][0];
  const westChamp=regions.WEST[regions.WEST.length-1][0];
  const midwestChamp=regions.MIDWEST[regions.MIDWEST.length-1][0];

  const ff1W=comp(eastChamp)>=comp(southChamp)?eastChamp:southChamp;
  const ff1L=ff1W===eastChamp?southChamp:eastChamp;
  const ff2W=comp(westChamp)>=comp(midwestChamp)?westChamp:midwestChamp;
  const ff2L=ff2W===westChamp?midwestChamp:westChamp;
  const champ=comp(ff1W)>=comp(ff2W)?ff1W:ff2W;
  const runner=champ===ff1W?ff2W:ff1W;

  const finalScore=predictScore(champ,runner);

  const ffCol=document.createElement('div');ffCol.className='ff-col';

  function ffTeamEl(t,won){
    const isFav=W.fav&&t.n===W.fav;
    const cls=['ff-team'];if(won)cls.push('w');if(!won)cls.push('l');if(isFav)cls.push('fav');
    return `<div class="${cls.join(' ')}"><span class="sd">${t.s}</span>${t.n}</div>`;
  }

  ffCol.innerHTML=`
    <div class="ff-label">Final Four</div>
    <div class="ff-game">${ffTeamEl(eastChamp,ff1W===eastChamp)}${ffTeamEl(southChamp,ff1W===southChamp)}</div>
    <div class="champ-box">
      <div class="champ-label">Champion</div>
      ${champ.n}
      <div class="champ-score">${finalScore.a} - ${finalScore.b}</div>
    </div>
    <div class="ff-game">${ffTeamEl(westChamp,ff2W===westChamp)}${ffTeamEl(midwestChamp,ff2W===midwestChamp)}</div>
  `;

  wrap.appendChild(leftHalf);
  wrap.appendChild(ffCol);
  wrap.appendChild(rightHalf);
}

readW();
