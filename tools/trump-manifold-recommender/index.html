<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trump Manifold Recommender</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --panel: #ffffff;
      --ink: #1a1a1a;
      --muted: #666;
      --border: #d7d7d2;
      --brand: #145a86;
      --danger: #9f1c1c;
      --ok: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #eceee9, var(--bg));
      line-height: 1.35;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    h1, h2, h3 { margin: 0 0 10px; }
    h1 { font-size: 1.35rem; letter-spacing: 0.01em; }
    h2 { font-size: 1.08rem; }
    h3 { font-size: 0.95rem; }

    .controls {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      align-items: end;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 0.88rem;
      color: var(--muted);
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      background: var(--brand);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary {
      background: #5d6771;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      min-height: 1.2em;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }

    .grid-2 {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    ul.clean {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .market-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }

    .market-item a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }

    .market-item a:hover { text-decoration: underline; }

    .meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .options-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .options-table th,
    .options-table td {
      border-bottom: 1px solid var(--border);
      padding: 6px;
      text-align: left;
      vertical-align: top;
    }

    .sliders {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    .slider-row {
      display: grid;
      gap: 4px;
    }

    .slider-row .head {
      display: flex;
      justify-content: space-between;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .recommend-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcff;
    }

    .recommend-item .edge {
      color: var(--ok);
      font-weight: 700;
      margin-left: 8px;
    }

    .small { font-size: 0.82rem; color: var(--muted); }

    @media (max-width: 700px) {
      .wrap { padding: 12px; }
      .panel { padding: 12px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1>Trump Manifold Recommender</h1>
      <div class="controls">
        <div class="field" style="grid-column: 1 / -1;">
          <label for="apiBase">Worker Base URL</label>
          <input id="apiBase" type="text" placeholder="https://your-worker.your-subdomain.workers.dev" />
        </div>
        <div class="field">
          <button id="syncBtn">Sync</button>
        </div>
        <div class="field">
          <button id="refreshBtn" class="secondary">Refresh Report</button>
        </div>
        <div class="field">
          <label>Last Sync</label>
          <div id="lastSync" class="small">Never</div>
        </div>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section class="panel">
      <h2>Preference Sliders</h2>
      <div class="sliders">
        <div class="slider-row">
          <div class="head"><span>Self-Interested</span><span id="v-self_interested">0.00</span></div>
          <input id="self_interested" type="range" min="-1" max="1" step="0.01" value="0" />
        </div>
        <div class="slider-row">
          <div class="head"><span>Loyalty Demand</span><span id="v-loyalty_demand">0.00</span></div>
          <input id="loyalty_demand" type="range" min="-1" max="1" step="0.01" value="0" />
        </div>
        <div class="slider-row">
          <div class="head"><span>Executive Power</span><span id="v-exec_power">0.00</span></div>
          <input id="exec_power" type="range" min="-1" max="1" step="0.01" value="0" />
        </div>
        <div class="slider-row">
          <div class="head"><span>Deal Making</span><span id="v-deal_making">0.00</span></div>
          <input id="deal_making" type="range" min="-1" max="1" step="0.01" value="0" />
        </div>
      </div>
      <div class="controls" style="margin-top: 10px;">
        <div class="field">
          <label for="threshold">Edge Threshold</label>
          <input id="threshold" type="number" min="0" max="1" step="0.01" value="0.05" />
        </div>
        <div class="field">
          <button id="recommendBtn">Run Recommendations</button>
        </div>
      </div>
    </section>

    <section class="panel grid-2">
      <div>
        <h2>New in Last 24h</h2>
        <ul id="newMarkets" class="clean"></ul>
      </div>
      <div>
        <h2>Ended in Last 24h</h2>
        <ul id="endedMarkets" class="clean"></ul>
      </div>
    </section>

    <section class="panel">
      <h2>Recommendations</h2>
      <div id="recommendations" class="clean"></div>
    </section>

    <section class="panel">
      <h2>Tracked Markets</h2>
      <div id="marketCount" class="small"></div>
      <div id="allMarkets" class="clean" style="margin-top: 8px;"></div>
    </section>
  </main>

  <script>
    const traits = ['self_interested', 'loyalty_demand', 'exec_power', 'deal_making'];

    const els = {
      apiBase: document.getElementById('apiBase'),
      syncBtn: document.getElementById('syncBtn'),
      refreshBtn: document.getElementById('refreshBtn'),
      recommendBtn: document.getElementById('recommendBtn'),
      threshold: document.getElementById('threshold'),
      status: document.getElementById('status'),
      lastSync: document.getElementById('lastSync'),
      newMarkets: document.getElementById('newMarkets'),
      endedMarkets: document.getElementById('endedMarkets'),
      allMarkets: document.getElementById('allMarkets'),
      marketCount: document.getElementById('marketCount'),
      recommendations: document.getElementById('recommendations'),
    };

    function init() {
      const stored = localStorage.getItem('workerBaseUrl') || '';
      els.apiBase.value = stored;

      for (const trait of traits) {
        const input = document.getElementById(trait);
        const label = document.getElementById(`v-${trait}`);
        input.addEventListener('input', () => {
          label.textContent = Number(input.value).toFixed(2);
        });
      }

      els.syncBtn.addEventListener('click', onSync);
      els.refreshBtn.addEventListener('click', onRefresh);
      els.recommendBtn.addEventListener('click', onRecommend);

      onRefresh();
    }

    function setStatus(text, mode = '') {
      els.status.textContent = text || '';
      els.status.className = `status ${mode}`.trim();
    }

    function getApiBase() {
      const base = (els.apiBase.value || '').trim().replace(/\/+$/, '');
      if (!base) throw new Error('Set Worker Base URL first.');
      localStorage.setItem('workerBaseUrl', base);
      return base;
    }

    async function api(path, options = {}) {
      const base = getApiBase();
      const resp = await fetch(`${base}${path}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      });

      const payload = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        throw new Error(payload.error || `Request failed (${resp.status})`);
      }
      return payload;
    }

    async function onSync() {
      setBusy(true);
      setStatus('Syncing markets...', '');
      try {
        const report = await api('/sync', { method: 'POST' });
        renderReport(report);
        setStatus('Sync completed.', 'ok');
      } catch (err) {
        setStatus(err.message, 'error');
      } finally {
        setBusy(false);
      }
    }

    async function onRefresh() {
      setBusy(true);
      setStatus('Loading report...', '');
      try {
        const report = await api('/report');
        renderReport(report);
        setStatus('Report loaded.', 'ok');
      } catch (err) {
        setStatus(err.message, 'error');
      } finally {
        setBusy(false);
      }
    }

    async function onRecommend() {
      setBusy(true);
      setStatus('Computing recommendations...', '');
      try {
        const weights = {};
        for (const trait of traits) {
          weights[trait] = Number(document.getElementById(trait).value);
        }

        const threshold = Number(els.threshold.value || '0.05');

        const result = await api('/recommend', {
          method: 'POST',
          body: JSON.stringify({ weights, threshold }),
        });

        renderRecommendations(result.recommendations || []);
        setStatus('Recommendations updated.', 'ok');
      } catch (err) {
        setStatus(err.message, 'error');
      } finally {
        setBusy(false);
      }
    }

    function setBusy(flag) {
      els.syncBtn.disabled = flag;
      els.refreshBtn.disabled = flag;
      els.recommendBtn.disabled = flag;
    }

    function renderReport(report) {
      const lastSync = report?.lastSyncTime;
      els.lastSync.textContent = lastSync ? new Date(lastSync).toLocaleString() : 'Never';

      renderSummaryList(els.newMarkets, report?.newMarkets24h || [], 'No new markets in last 24h.');
      renderSummaryList(els.endedMarkets, report?.closedMarkets24h || [], 'No ended markets in last 24h.');

      const markets = report?.markets || [];
      els.marketCount.textContent = `${markets.length} market(s)`;
      renderAllMarkets(markets);
    }

    function renderSummaryList(container, items, emptyText) {
      container.innerHTML = '';
      if (!items.length) {
        const li = document.createElement('li');
        li.className = 'small';
        li.textContent = emptyText;
        container.appendChild(li);
        return;
      }

      for (const m of items) {
        const li = document.createElement('li');
        li.className = 'market-item';
        li.innerHTML = `
          <a href="${escapeAttr(m.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(m.title || m.id)}</a>
          <div class="meta">Created: ${fmtTime(m.createdTime)} | Closed: ${fmtTime(m.closeTime || m.resolutionTime)} | ${m.isOpen ? 'Open' : 'Closed'}</div>
        `;
        container.appendChild(li);
      }
    }

    function renderAllMarkets(markets) {
      els.allMarkets.innerHTML = '';
      if (!markets.length) {
        const div = document.createElement('div');
        div.className = 'small';
        div.textContent = 'No tracked markets yet. Run Sync.';
        els.allMarkets.appendChild(div);
        return;
      }

      for (const m of markets) {
        const card = document.createElement('div');
        card.className = 'market-item';

        const rows = (m.options || []).map((o) => {
          const t = o.traits || {};
          return `
            <tr>
              <td>${escapeHtml(o.text)}</td>
              <td>${fmtPct(o.probability)}</td>
              <td>${fmtTrait(t.self_interested)}</td>
              <td>${fmtTrait(t.loyalty_demand)}</td>
              <td>${fmtTrait(t.exec_power)}</td>
              <td>${fmtTrait(t.deal_making)}</td>
            </tr>
          `;
        }).join('');

        card.innerHTML = `
          <a href="${escapeAttr(m.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(m.title || m.id)}</a>
          <div class="meta">${m.isOpen ? 'Open' : 'Closed'} | Created: ${fmtTime(m.createdTime)} | Options: ${m.optionCount || (m.options || []).length}</div>
          <table class="options-table">
            <thead>
              <tr>
                <th>Option</th>
                <th>Market P</th>
                <th>Self</th>
                <th>Loyalty</th>
                <th>Exec</th>
                <th>Deal</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;

        els.allMarkets.appendChild(card);
      }
    }

    function renderRecommendations(items) {
      els.recommendations.innerHTML = '';
      if (!items.length) {
        const div = document.createElement('div');
        div.className = 'small';
        div.textContent = 'No recommendations above threshold.';
        els.recommendations.appendChild(div);
        return;
      }

      for (const r of items) {
        const card = document.createElement('div');
        card.className = 'recommend-item';
        card.innerHTML = `
          <div>
            <a href="${escapeAttr(r.marketUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.marketTitle)}</a>
            <span class="edge">Edge: ${fmtPct(r.edge)}</span>
          </div>
          <div class="meta">Pick: ${escapeHtml(r.pick)} | Market P: ${fmtPct(r.marketProbability)} | Trait P: ${fmtPct(r.traitImpliedProbability)}</div>
          <div class="small">${escapeHtml(r.explanation || '')}</div>
        `;
        els.recommendations.appendChild(card);
      }
    }

    function fmtTime(ms) {
      if (!ms) return 'n/a';
      const n = Number(ms);
      if (!Number.isFinite(n)) return 'n/a';
      return new Date(n).toLocaleString();
    }

    function fmtPct(v) {
      const n = Number(v);
      if (!Number.isFinite(n)) return '0.0%';
      return `${(n * 100).toFixed(1)}%`;
    }

    function fmtTrait(v) {
      const n = Number(v);
      if (!Number.isFinite(n)) return '0.00';
      return n.toFixed(2);
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(s) {
      return escapeHtml(s).replace(/`/g, '&#096;');
    }

    init();
  </script>
</body>
</html>
