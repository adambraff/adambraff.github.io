const bytes = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
const salt = bytes.slice(0, 16), iv = bytes.slice(16, 28), ct = bytes.slice(28);
async function tryOpen(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct); // throws on wrong password
  const html = new TextDecoder().decode(plain);
  try { sessionStorage.setItem("hh-pw", pw); } catch (e) {}
  document.open(); document.write(html); document.close();
}
const pwEl = document.getElementById("pw"), goEl = document.getElementById("go"), msgEl = document.getElementById("msg");
async function submit() {
  goEl.disabled = true; msgEl.textContent = "";
  try { await tryOpen(pwEl.value); }
  catch (e) { msgEl.textContent = "Wrong password."; goEl.disabled = false; pwEl.select(); }
}
goEl.addEventListener("click", submit);
pwEl.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
try { const saved = sessionStorage.getItem("hh-pw"); if (saved) tryOpen(saved).catch(() => {}); } catch (e) {}
</script>
