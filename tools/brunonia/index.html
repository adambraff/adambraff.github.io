<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7E1712">
<title>First Bank of Brunonia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#7E1712; --red-2:#A3241C; --brown:#4A2511; --gold:#D99A1E; --gold-soft:#FBEFD2;
  --cream:#FBF6EE; --card:#FFFFFF; --ink:#2B1A12; --muted:#7A6556; --line:#E7DCCD;
  --ok:#2F7D4F; --warn:#B3261E;
  --slab:"Roboto Slab",Rockwell,Georgia,serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hrow{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hrow img{width:38px;height:38px;background:#fff;border-radius:50%;padding:2px}
.htitle{font-family:var(--slab);font-weight:800;font-size:17px;line-height:1.05}
.hteam{font-size:12px;opacity:.85}
.dots{max-width:560px;margin:8px auto 0;display:flex;gap:5px}
.dots span{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
.dots span.on{background:var(--gold)}
h2{font-family:var(--slab);font-weight:800;font-size:24px;line-height:1.15;margin:22px 0 4px;color:var(--brown)}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.count{display:inline-block;font-weight:600;font-size:13px;padding:3px 9px;border-radius:999px;background:var(--gold-soft);color:var(--brown);margin-bottom:12px}
.count.bad{background:#FBE3E1;color:var(--warn)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 14px 13px 50px;margin:0 0 10px;position:relative;cursor:pointer;transition:border-color .12s,background .12s}
.opt::before{content:"";position:absolute;left:15px;top:16px;width:22px;height:22px;border:2px solid #C9B9A6;background:#fff}
.opt.radio::before{border-radius:50%}
.opt.check::before{border-radius:6px}
.opt.sel{border-color:var(--red);background:#FFF9F6}
.opt.sel::before{border-color:var(--red);background:var(--red)}
.opt.sel::after{content:"";position:absolute;left:23px;top:20px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt.dim{opacity:.45}
.oname{font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wk{flex:none;font-size:12px;font-weight:700;color:var(--red);background:#FCEAE6;border-radius:999px;padding:2px 8px;white-space:nowrap}
.odesc{font-size:14px;color:var(--muted);margin-top:3px}
.osp{font-size:12px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;color:#9A6A10}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11.5px;background:#F4EEE6;color:#5A4334;border-radius:6px;padding:3px 7px}
details{margin-top:8px;font-size:12px}
summary{color:var(--red);font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.samp{overflow-x:auto;margin-top:6px}
.samp table{border-collapse:collapse;font-size:11.5px;white-space:nowrap}
.samp td{border-top:1px solid var(--line);padding:4px 8px 4px 0;color:#4B3A2F}
.hero{text-align:center;padding-top:18px}
.hero img{width:190px;height:auto}
.hero p{color:#4B3A2F;font-size:15px;max-width:420px;margin:10px auto}
label.f{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
input.t{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:17px}
input.t:focus{outline:none;border-color:var(--red)}
.big{font-family:var(--slab);font-weight:800;font-size:64px;color:var(--red);text-align:center;margin:18px 0 6px}
.big.empty{color:#CBBBA8}
input[type=range]{width:100%;accent-color:var(--red);height:36px}
.rlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.step-btns{display:flex;justify-content:center;gap:12px;margin-top:10px}
.step-btns button{width:64px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:18px}
.tl{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 16px}
.tl .r{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px solid #F1E9DE}
.tl .r:last-child{border-bottom:0}
.tl .r.tot{font-weight:700;color:var(--brown)}
.tl .r.full{font-weight:800;color:var(--red);font-size:16px}
.sum{background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.sum .r{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #F1E9DE;padding:10px 14px;cursor:pointer}
.sum .r:last-child{border-bottom:0}
.sum .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.sum .v{font-size:15px;font-weight:600}
.sum .v.miss{color:var(--warn)}
.done{background:var(--ok);color:#fff;border-radius:14px;padding:14px;text-align:center;font-weight:600;margin-bottom:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;cursor:pointer;margin-bottom:10px}
.btn.p{background:var(--red);color:#fff}
.btn.s{background:#fff;border:2px solid var(--line);color:var(--brown)}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);text-align:center}
footer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(74,37,17,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.fin{max-width:560px;margin:0 auto}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:9px}
.meter .lbl{flex:none;color:var(--muted);font-weight:600}
.bar{flex:1;height:10px;background:#F1E9DE;border-radius:5px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .35s}
.bar i.p{background:var(--brown)}
.bar i.f{background:var(--gold);opacity:.75}
.meter .val{flex:none;font-weight:700;color:var(--red);min-width:118px;text-align:right}
.nav{display:flex;gap:10px}
.nav button{flex:1;border-radius:12px;padding:13px;font-weight:700;font-size:16px;border:0;cursor:pointer}
.nav .back{flex:0 0 96px;background:#F4EEE6;color:var(--brown)}
.nav .next{background:var(--red);color:#fff}
.nav .next:disabled{background:#D9C9BA;cursor:default}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--brown);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>

const by=(arr,id)=>arr.find(x=>x.id===id);

const month=w=>{const d=new Date(kick.getTime()+w*7*864e5);return d.toLocaleString("en-US",{month:"short",year:"numeric"})};

function timeline(){
  const prov=S.data.length?Math.max(...S.data.map(id=>by(D.data,id).w)):null;
  const build=S.tech?by(D.tech,S.tech).w:null;
  const ctl=S.ctl.reduce((a,id)=>a+by(D.controls,id).w,0);
  const r=S.rel?by(D.release,S.rel):null;
  const adj=!r?0:(r.pre==="halfBuild"?-Math.round((build||0)/2):r.pre);
  const fixed=D.fixed.reduce((a,f)=>a+f.w,0);
  const ready=prov!==null&&build!==null;
  const prod=ready?prov+build+ctl+adj+fixed:null;
  return {prov,build,ctl,adj,fixed,prod,first:(prod!==null&&r)?prod+r.first:null,full:(prod!==null&&r)?prod+r.full:null};
}
function valid(step){
  switch(STEPS[step]){
    case "start":return S.team.trim().length>0;

    case "tech":return !!S.tech;
    case "ctl":return true;
    case "rel":return !!S.rel;
    case "prob":return S.prob!==null;
    default:return true;
  }
}

      <p>Your team has budget for <b>one</b> analytics project at the First Bank of Brunonia. Make five decisions, then forecast the odds that it delivers the intended improvement.</p>
      <p style="font-size:13px;color:var(--muted)">${D.baseline}</p></div>
      <label class="f" for="team">Team name</label>
      <input class="t" id="team" maxlength="40" placeholder="e.g. Fox Point" value="${esc(S.team)}" autocomplete="off">`;
  }
  if(st==="uc"){
    h=`<h2>1. Use case</h2><p class="sub">Pick the business decision your project will support.</p>`+
      D.useCases.map(u=>opt("radio",S.uc===u.id,false,`<div class="oname">${u.name}</div><div class="osp">${u.sponsor}</div><div class="odesc">${u.q}</div>${u.note?`<div class="odesc" style="font-size:12.5px;font-style:italic">${u.note}</div>`:""}`,`data-k="uc" data-id="${u.id}"`)).join("");
  }
  if(st==="data"){
    const n=S.data.length;
    h=`<h2>2. Data sources</h2><p class="sub">Pick up to three to bring into this initiative. Weeks = incremental effort to provision.</p><span class="count">${n} of 3 selected</span>`+
      D.data.map(d=>{const sel=S.data.includes(d.id);return opt("check",sel,!sel&&n>=3,

         <div class="chips"><span class="chip">${d.cov}</span><span class="chip">${d.fresh}</span><span class="chip">${d.match}</span></div>
         <details onclick="event.stopPropagation()"><summary>Sample rows ›</summary><div class="samp"><table>${d.sample.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div></details>`,
        `data-k="data" data-id="${d.id}"`)}).join("");
  }

    h=`<h2>3. Analytic technique</h2><p class="sub">Pick one. Weeks = time to build in dev.</p>`+

      <div class="rlab"><span>0%</span><span>50%</span><span>100%</span></div>
      <div class="step-btns"><button id="pm" aria-label="minus 1">−1</button><button id="pp" aria-label="plus 1">+1</button></div>`;
  }
  if(st==="sum"){
    const t=timeline();
    const row=(k,v,step)=>`<button class="r" data-go="${step}"><div class="k">${k}</div><div class="v${v?"":" miss"}">${v||"Missing: tap to fix"}</div></button>`;
    h=`<h2>Your plan</h2><p class="sub">Tap any line to change it.</p>`+
      (S.submitted?`<div class="done">Plan submitted${S.subAt?" at "+S.subAt:""}. You can still edit and resubmit.</div>`:"")+

        ${row("Team",esc(S.team),0)}
        ${row("Use case",S.uc&&by(D.useCases,S.uc).name,1)}
        ${row("Data",S.data.map(id=>by(D.data,id).name).join(", "),2)}
        ${row("Technique",S.tech&&by(D.tech,S.tech).name,3)}
        ${row("Controls",S.ctl.length?S.ctl.map(id=>by(D.controls,id).name).join(", "):"No additional controls",4)}
        ${row("Release",S.rel&&by(D.release,S.rel).name,5)}
        ${row("Probability of intended improvement",S.prob!==null?S.prob+"%":"",6)}
      </div>
      <div class="tl">
        <div class="r"><span>Provision data access</span><span>${t.prov??"—"} wks</span></div>
        <div class="r"><span>Build in dev</span><span>${t.build??"—"} wks</span></div>
        <div class="r"><span>Controls</span><span>${t.ctl} wks</span></div>
        <div class="r"><span>Release strategy adjustment</span><span>${t.adj>0?"+":""}${t.adj} wks</span></div>
        ${D.fixed.map(f=>`<div class="r"><span>${f.name}</span><span>${f.w} wks</span></div>`).join("")}
        <div class="r tot"><span>In production</span><span>${t.prod!==null?`wk ${t.prod} · ${month(t.prod)}`:"—"}</span></div>
        <div class="r tot"><span>First results</span><span>${t.first!==null?`wk ${t.first} · ${month(t.first)}`:"—"}</span></div>
        <div class="r full"><span>Target full rollout</span><span>${t.full!==null?`wk ${t.full} · ${month(t.full)}`:"—"}</span></div>
      </div>
      <p class="note" style="text-align:left;margin:-6px 2px 16px">${D.timingNote}</p>
      <button class="btn p" id="submit" ${complete()&&!S.sending?"":"disabled"}>${S.sending?"Submitting…":S.submitted?"Resubmit plan":"Submit plan"}</button>
      <p class="note">Kickoff: ${kick.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</p>`;
  }
  $("main").innerHTML=h;
  wire(st);
  foot();
  save();
}
function complete(){return [0,1,2,3,5,6].every(valid)}

  const t=timeline(), st=STEPS[S.step];
  const max=80;
  $("barP").style.width=t.prod!==null?Math.min(100,t.prod/max*100)+"%":"0";
  $("barF").style.width=t.full!==null?Math.min(100,t.full/max*100)+"%":(t.prod!==null?Math.min(100,t.prod/max*100)+"%":"0");
  $("mval").textContent=t.full!==null?`Full rollout wk ${t.full}`:t.prod!==null?`In prod wk ${t.prod}`:"—";
  $("meter").classList.toggle("hide",st==="start");
  $("back").classList.toggle("hide",S.step===0);
  const nx=$("next");
  nx.classList.toggle("hide",st==="sum");
  nx.disabled=!valid(S.step);
  nx.textContent=st==="start"?"Start":st==="prob"?"Review plan":"Next";
  $("foot").querySelector(".nav").classList.toggle("hide",st==="sum"&&false);
}
function wire(st){
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.k,id=b.dataset.id;
    if(k==="uc"||k==="tech"||k==="rel"){S[k]=id}
    else{
      const a=S[k];
      if(a.includes(id)) S[k]=a.filter(x=>x!==id);
      else if(k==="data"&&a.length>=3){toast("Max three data sources. Deselect one first.");return}
      else S[k]=[...a,id];
    }
    S.submitted=false; const y=window.scrollY; render(); window.scrollTo(0,y);
  }));
  if(st==="start"){const i=$("team");i.addEventListener("input",()=>{S.team=i.value;S.submitted=false;foot();save();$("hteam").textContent=S.team||"Analytics project simulation"});}
  if(st==="prob"){
    const r=$("pr"),set=v=>{S.prob=Math.max(0,Math.min(100,v));S.submitted=false;$("pv").textContent=S.prob+"%";$("pv").classList.remove("empty");r.value=S.prob;foot();save()};
    r.addEventListener("input",()=>set(+r.value));
    $("pm").addEventListener("click",()=>set((S.prob??50)-1));
    $("pp").addEventListener("click",()=>set((S.prob??50)+1));
  }
  if(st==="sum"){
    document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.go)));
    $("submit").addEventListener("click",submit);
  }
}
function text(){
  const t=timeline();
  return [`First Bank of Brunonia: ${S.team}`,
  `Use case: ${S.uc?by(D.useCases,S.uc).name:"-"}`,
  `Data: ${S.data.map(id=>by(D.data,id).name).join(", ")||"-"}`,
  `Technique: ${S.tech?by(D.tech,S.tech).name:"-"}`,
  `Controls: ${S.ctl.map(id=>by(D.controls,id).name).join(", ")||"No additional controls"}`,
  `Release: ${S.rel?by(D.release,S.rel).name:"-"}`,
  `In production: week ${t.prod??"-"} | First results: week ${t.first??"-"} | Target full rollout: week ${t.full??"-"}`,
  `Probability of success: ${S.prob!==null?S.prob+"%":"-"}`].join("\n");
}
const ENDPOINT="";
function payload(){
  const t=timeline();
  return {team:S.team.trim(),useCase:S.uc?by(D.useCases,S.uc).name:"",data:S.data.map(id=>by(D.data,id).name).join(", "),
    technique:S.tech?by(D.tech,S.tech).name:"",controls:S.ctl.map(id=>by(D.controls,id).name).join(", ")||"No additional controls",
    release:S.rel?by(D.release,S.rel).name:"",prodWeek:t.prod,firstResultsWeek:t.first,fullRolloutWeek:t.full,probability:S.prob};
}
async function submit(){
  if(!complete()) return;
  if(!ENDPOINT.startsWith("https://")){toast("Submission is not set up yet. Show this screen to the instructor.");return}
  S.sending=true; render();
  try{
    await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload())});
    S.submitted=true; S.subAt=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  }catch(e){ toast("No connection. Check wifi and tap Submit again."); }
  S.sending=false; render(); window.scrollTo(0,0);
}
if(new URLSearchParams(location.search).has("reset")){S={step:0,team:"",uc:null,data:[],tech:null,ctl:[],rel:null,prob:null,submitted:false};}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}
function go(n){S.step=n;render();window.scrollTo(0,0)}
$("next").addEventListener("click",()=>{if(valid(S.step))go(S.step+1)});
$("back").addEventListener("click",()=>go(Math.max(0,S.step-1)));
render();
</script>
</body>
</html>
