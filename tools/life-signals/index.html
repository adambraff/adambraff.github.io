<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Life Signals — Braff & Co.</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    min-height: 100vh;
  }

  /* ---------- LAYOUT ---------- */
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

  .topnav {
    position: sticky; top: 0; z-index: 20;
    background: rgba(15,17,23,0.93);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topnav-inner {
    max-width: 1280px; margin: 0 auto; padding: 14px 32px;
    display: flex; align-items: center; gap: 24px;
  }
  .topnav .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:0.95rem; letter-spacing: 0.01em; }
  .topnav .logo img { height: 22px; display:block; opacity:0.95; }
  .topnav nav { display:flex; gap: 22px; margin-left: auto; }
  .topnav nav a {
    color: var(--fg-muted); text-decoration:none; font-size: 0.82rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.05em; transition: color var(--dur-fast) var(--ease);
  }
  .topnav nav a:hover, .topnav nav a.active { color: var(--fg); }
  .topnav nav a.active { color: var(--blue); }

  /* ---------- HERO ---------- */
  .hero { padding: 64px 0 32px; border-bottom: 1px solid var(--border-soft); }
  .hero h1 {
    font-size: 2.6rem; margin: 0 0 16px; font-weight: 700; line-height: 1.1;
    letter-spacing: -0.02em;
  }
  .hero .subtitle {
    color: var(--fg-muted); max-width: 820px; font-size: 1.08rem; line-height: 1.7;
  }
  .hero .subtitle b { color: var(--fg); font-weight: 600; }
  .hero .meta-row {
    display: flex; gap: 40px; margin-top: 32px; flex-wrap: wrap;
  }
  .hero .meta-item { display: flex; flex-direction: column; gap: 4px; }
  .hero .meta-item .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-muted); }
  .hero .meta-item .val { font-size: 1.4rem; font-weight: 600; }

  /* ---------- SECTION ---------- */
  section.block { padding: 56px 0; border-bottom: 1px solid var(--border-soft); }
  section.block h2 {
    font-size: 1.6rem; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em;
  }
  section.block .sect-sub { color: var(--fg-muted); font-size: 0.95rem; margin-bottom: 28px; max-width: 820px; line-height: 1.6; }

  /* ---------- CARDS / PANELS ---------- */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
  .panel-pad { padding: 20px 24px; }

  .stat-card { background: var(--surface); border:1px solid var(--border); border-radius: 6px; padding: 16px 18px; }
  .stat-card .label { font-size: 0.7rem; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .stat-card .val { font-size: 1.8rem; font-weight: 700; margin-top: 4px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat-card .hint { font-size: 0.78rem; color: var(--fg-muted); margin-top: 8px; line-height: 1.4; }
  .stat-card .val .unit { font-size: 0.9rem; color: var(--fg-muted); font-weight: 500; margin-left: 4px; }

  /* Findings callout — Braff signature */
  .finding {
    border-left: 3px solid var(--blue);
    background: rgba(108,140,255,0.05);
    padding: 14px 18px; border-radius: 0 3px 3px 0;
    margin: 12px 0;
    font-size: 0.93rem; line-height: 1.65; color: var(--fg-2);
  }
  .finding b.tag { color: var(--blue); font-weight: 700; margin-right: 8px; letter-spacing: 0.02em; }

  /* Buttons */
  .btn {
    background: transparent; border: 1px solid var(--border); color: var(--fg-2);
    padding: 8px 14px; font-size: 0.82rem; border-radius: 4px; cursor: pointer;
    font-family: var(--font-sans); transition: all var(--dur-fast) var(--ease);
  }
  .btn:hover { border-color: var(--blue); color: var(--fg); }
  .btn.active { background: rgba(108,140,255,0.12); border-color: var(--blue); color: var(--blue); }
  .btn.small { padding: 4px 10px; font-size: 0.72rem; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }
  .btn-group { display: inline-flex; gap: 0; border:1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .btn-group .btn { border: 0; border-radius: 0; border-right: 1px solid var(--border); }
  .btn-group .btn:last-child { border-right: 0; }

  input[type=text], input[type=number], input[type=date], input[type=password], textarea {
    background: #0f1117; border: 1px solid var(--border); color: var(--fg);
    padding: 8px 10px; font-family: var(--font-sans); font-size: 0.85rem;
    border-radius: 4px; outline: none; transition: border-color var(--dur-fast) var(--ease);
  }
  input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(108,140,255,0.15); }

  /* Chart container baseline */
  .chart-wrap { position: relative; background: var(--surface); border:1px solid var(--border); border-radius: 6px; padding: 18px 20px; }
  .chart-wrap .chart-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
  .chart-wrap .chart-sub { font-size: 0.78rem; color: var(--fg-muted); margin-bottom: 14px; }

  /* Tweaks panel */
  .tweaks {
    position: fixed; right: 20px; bottom: 20px; z-index: 50;
    width: 280px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    display: none;
  }
  .tweaks.show { display: block; }
  .tweaks h4 { margin: 0 0 14px; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-muted); font-weight: 600; }
  .tweaks-row { display:flex; flex-direction:column; gap: 6px; margin-bottom: 14px; }
  .tweaks-row .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-muted); font-weight: 600; }
  .tweaks-row input[type=range] { width: 100%; accent-color: var(--blue); }

  /* Axis and tooltip shared */
  .axis-text { font-size: 10px; fill: var(--fg-muted-2); font-family: var(--font-sans); }
  .axis-line { stroke: var(--border); stroke-width: 1; }
  .gridline { stroke: var(--border-soft); stroke-width: 1; stroke-dasharray: 2 3; }
  .tooltip {
    position: absolute; pointer-events: none; background: rgba(15,17,23,0.96);
    border: 1px solid var(--border); padding: 8px 10px; border-radius: 4px; font-size: 0.78rem;
    color: var(--fg); z-index: 10; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .tooltip .tt-k { color: var(--fg-muted); }
  .tooltip .tt-v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tooltip hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }

  /* Grid layouts used a lot */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .grid-main { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
  @media (max-width: 900px) {
    .grid-2, .grid-3, .grid-main { grid-template-columns: 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr; }
  }

  /* Events table */
  .event-add { background: #0f1117; border: 1px solid var(--border-soft); border-radius: 6px; padding: 10px; margin-bottom: 12px; }
  .event-list { display: flex; flex-direction: column; gap: 6px; max-height: 440px; overflow-y: auto; padding-right: 4px; }
  .event-row { display: flex; gap: 10px; align-items: center; padding: 7px 10px; background: #0f1117; border: 1px solid var(--border-soft); border-radius: 4px; cursor: pointer; transition: border-color 0.15s; }
  .event-row:hover { border-color: var(--border); }
  .event-row.editing { cursor: default; border-color: var(--blue); background: #121520; }
  .event-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .event-row .date { font-size: 0.72rem; color: var(--fg-muted); font-variant-numeric: tabular-nums; min-width: 92px; white-space: nowrap; }
  .event-row .label { font-size: 0.82rem; color: var(--fg); flex: 1; text-transform: none; letter-spacing: normal; font-weight: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .event-row .delete { opacity: 0.4; cursor: pointer; font-size: 16px; padding: 0 6px; flex-shrink:0; }
  .event-row .delete:hover { opacity: 1; color: var(--red); }

  .scroll-hint { position:absolute; top:8px; right:10px; font-size: 0.65rem; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.05em; }

  footer { padding: 40px 0 60px; color: var(--fg-muted); font-size: 0.8rem; line-height: 1.7; }
  footer i { color: var(--fg-muted-2); }

  /* ---------- GATE OVERLAY ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .gate-box {
    max-width: 380px; width: 100%;
    padding: 40px 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  }
  .gate-box h1 {
    font-size: 1.6rem; font-weight: 700; margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .gate-box .sub {
    color: var(--fg-muted); font-size: 0.86rem; margin: 0 0 20px; line-height: 1.5;
  }
  .gate-box input[type=password] {
    width: 100%; padding: 10px 12px; font-size: 0.95rem;
    margin-bottom: 12px; font-family: var(--font-sans);
  }
  .gate-box button {
    width: 100%; padding: 10px 16px;
    background: var(--blue); color: white;
    border: 0; border-radius: 4px;
    font-family: var(--font-sans); font-size: 0.9rem;
    font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  .gate-box button:hover { opacity: 0.9; }
  .gate-box .err {
    color: #ff6b6b; font-size: 0.82rem; margin-top: 12px; min-height: 1em;
  }
</style>
</head>
<body>

<!-- Password gate: client-side only, not real security -->
<div id="gate" class="gate">
  <div class="gate-box">
    <h1>Life Signals</h1>
    <div class="sub">Personal dashboard. Enter password to continue.</div>
    <input type="password" id="pwd" autofocus autocomplete="off" spellcheck="false" />
    <button id="gate-ok">Unlock</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div id="root"></div>

<!-- Tweakable config: smoothing default -->
<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

<script>
// ---- Password gate logic (client-side; obfuscation, not security) ----
(function(){
  const GATE_HASH = '3d697475960498dd52b28db2bc067661f38a2e4c9d95e2e26bb508aca06ce34c';
  const gate = document.getElementById('gate');
  const pwd  = document.getElementById('pwd');
  const err  = document.getElementById('gate-err');
  const btn  = document.getElementById('gate-ok');

  async function sha256Hex(s) {
    const buf = new TextEncoder().encode(s);
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  async function tryUnlock(val) {
    err.textContent = '';
    if (!val) { err.textContent = 'Enter a password.'; return; }
    const h = await sha256Hex(val);
    if (h === GATE_HASH) {
      try { sessionStorage.setItem('ls_unlocked', '1'); } catch(_) {}
      gate.style.display = 'none';
    } else {
      err.textContent = 'Wrong password.';
      pwd.value = '';
      pwd.focus();
    }
  }

  // Already unlocked this session?
  try {
    if (sessionStorage.getItem('ls_unlocked') === '1') {
      gate.style.display = 'none';
    }
  } catch(_) {}

  btn.addEventListener('click', () => tryUnlock(pwd.value));
  pwd.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(pwd.value); });
})();
</script>
