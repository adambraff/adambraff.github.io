<html lang="en">
<head>
<meta charset="utf-8">
<title>2026 Gym Tech Stack</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: scenario chips; stack diagram (bottom = system of record, top = decisions) beside a step panel with mechanism, timing and records grouped by level */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --ink:#15201B; --muted:#56655E; --line:#C7D0CB; --band:#E2E8E4; --node:#FFFFFF; --hi:#FFF2E8;
  --live:#D9480F; --load:#1F64C4; --score:#11795A; --act:#B3195A; --third:#6D4FC4;
  --live-soft:#FBE3D6; --load-soft:#DCE8F8; --score-soft:#D6EEE5; --act-soft:#F8DDE8; --third-soft:#E7E0F8;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#161E1B; --ink:#E6ECE8; --muted:#97A59E; --line:#2D3934; --band:#18221F; --node:#1D2723; --hi:#2C2118;
  --live:#FF8A4C; --load:#6AA8FF; --score:#3CC690; --act:#FF6FA6; --third:#AE92FF;
  --live-soft:#3A2418; --load-soft:#17283F; --score-soft:#123126; --act-soft:#3A1828; --third-soft:#271F3F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#161E1B; --ink:#E6ECE8; --muted:#97A59E; --line:#2D3934; --band:#18221F; --node:#1D2723; --hi:#2C2118;
  --live:#FF8A4C; --load:#6AA8FF; --score:#3CC690; --act:#FF6FA6; --third:#AE92FF;
  --live-soft:#3A2418; --load-soft:#17283F; --score-soft:#123126; --act-soft:#3A1828; --third-soft:#271F3F;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1500px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px;max-width:900px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--live)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:1;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:17px;max-width:72ch}
.caveat{margin:0;font-size:14px;color:var(--muted);max-width:90ch;border-left:3px solid var(--line);padding-left:12px}
.adv{display:inline-block;font:700 11px/1 var(--display);letter-spacing:.08em;padding:3px 6px;border-radius:4px;border:1.2px solid var(--muted);color:var(--muted);vertical-align:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{font:600 16px/1 var(--display);letter-spacing:.02em;padding:11px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media (max-width:1200px){.main{grid-template-columns:minmax(0,1fr)}}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.dtop{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;padding:0 4px}
.dtop .hint{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:600 15px/1 var(--display);padding:0 14px;min-height:40px;border:none;background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.scroll{overflow-x:auto}
svg.map{display:block;width:100%;min-width:900px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);padding:4px 6px 2px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:26px;height:4px;border-radius:2px;display:inline-block}
.sw.dash{height:0;border-top:3px dashed var(--muted);border-radius:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.count{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.kind{font:600 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:6px}
.kind.live{background:var(--live-soft);color:var(--live)} .kind.load{background:var(--load-soft);color:var(--load)}
.kind.score{background:var(--score-soft);color:var(--score)} .kind.act{background:var(--act-soft);color:var(--act)}
.kind.third{background:var(--third-soft);color:var(--third)}
.panel h2{margin:0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;text-wrap:balance}
.route{font-size:14px;color:var(--muted)}
.route b{color:var(--ink);font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:13px;padding:4px 9px;border-radius:6px;background:var(--band);color:var(--ink)}
.fact b{font-weight:600;color:var(--muted);margin-right:4px}
.fact.staff{background:var(--live-soft);color:var(--live);font-weight:600}
.body{margin:0}
.value{margin:0;padding:12px 14px;border-radius:10px;background:var(--band)}
.vl{display:block;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.branch{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:10px}
.branch .seg{align-self:flex-start;flex-wrap:wrap}
.recs{display:flex;flex-direction:column;gap:8px}
.grp{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grp h3{margin:0;font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;background:var(--bg);display:flex;justify-content:space-between}
.grp h3 span{font-weight:500;letter-spacing:.04em;text-transform:none;font-family:var(--body)}
.rows{display:flex;flex-direction:column}
.row{padding:6px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.row:first-child{border-top:none}
.row.new{background:var(--hi)}
.rtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rk{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row.new .rk{color:var(--live)}
.rv{font-size:14.5px;overflow-wrap:anywhere}
.rs{font-size:12px;color:var(--muted)}
.tag{font:700 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:4px;flex:none}
.tag.o{background:var(--band);color:var(--ink)}
.tag.e{background:var(--third-soft);color:var(--third)}
.tag.p{background:var(--score-soft);color:var(--score)}
.none{padding:8px 10px;font-size:13px;color:var(--muted);font-style:italic}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:600 16px/1 var(--display);letter-spacing:.03em;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:none;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.dot i{display:block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.done i{background:var(--muted)}
.dot[aria-current="step"] i{width:12px;height:12px;background:var(--live)}
.dot:focus-visible{outline:2px solid var(--live)}
details.text{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
details.text summary{cursor:pointer;font:600 17px/1.3 var(--display);letter-spacing:.02em}
details.text ol{margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:100ch}
details.text li span{color:var(--muted);font-size:14px}
/* SVG */
.band{fill:var(--band)}
.bandnum{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--ink);letter-spacing:.08em}
.bandblurb{font-family:var(--body);font-size:13px;fill:var(--muted)}
.tpbox{fill:none;stroke:var(--third);stroke-dasharray:5 5;stroke-width:1.2;opacity:.6}
.tphead{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;fill:var(--third)}
.tpsub{font-family:var(--body);font-size:12px;fill:var(--muted)}
.node rect.box{fill:var(--node);stroke:var(--line);stroke-width:1.3;transition:stroke .3s,fill .3s}
.node text.lbl{font-family:var(--display);font-weight:600;font-size:15px;fill:var(--ink);text-anchor:middle}
.node rect.advbg{fill:var(--node);stroke:var(--muted);stroke-width:1}
.node text.advt{font-family:var(--display);font-weight:700;font-size:10px;fill:var(--muted);text-anchor:middle;letter-spacing:.06em}
.node.touched rect.box{stroke:var(--muted);stroke-width:1.8}
.node.on rect.box{stroke-width:3}
.node.on.k-live rect.box{stroke:var(--live);fill:var(--live-soft)}
.node.on.k-load rect.box{stroke:var(--load);fill:var(--load-soft)}
.node.on.k-score rect.box{stroke:var(--score);fill:var(--score-soft)}
.node.on.k-act rect.box{stroke:var(--act);fill:var(--act-soft)}
.node.on.k-third rect.box{stroke:var(--third);fill:var(--third-soft)}
.actor circle.bg{fill:var(--node);stroke:var(--line);stroke-width:1.3}
.actor.touched circle.bg{stroke:var(--muted);stroke-width:1.8}
.actor.on circle.bg{stroke:var(--live);stroke-width:3;fill:var(--live-soft)}
.actor .fig{fill:var(--ink)}
.actor text{font-family:var(--display);font-weight:600;font-size:15px;fill:var(--ink);text-anchor:middle}
.edge{fill:none;stroke-linecap:round}
.edge.future{stroke:var(--line);stroke-width:1.6}
.edge.past{stroke-width:2.2;opacity:.55}
.edge.active{stroke-width:3.6}
.edge.staff{stroke-dasharray:8 6}
.edge.future.staff{stroke-dasharray:3 6}
.edge.hide{display:none}
.k-live.edge{stroke:var(--live)} .k-load.edge{stroke:var(--load)} .k-score.edge{stroke:var(--score)} .k-act.edge{stroke:var(--act)} .k-third.edge{stroke:var(--third)}
.edge.future{stroke:var(--line)}
.mk-live{fill:var(--live)} .mk-load{fill:var(--load)} .mk-score{fill:var(--score)} .mk-act{fill:var(--act)} .mk-third{fill:var(--third)} .mk-future{fill:var(--line)}
.pk.k-live{fill:var(--live)} .pk.k-load{fill:var(--load)} .pk.k-score{fill:var(--score)} .pk.k-act{fill:var(--act)} .pk.k-third{fill:var(--third)}
.halo{opacity:.25}
.elab rect{fill:var(--surface);stroke-width:1.5}
.elab text{font-family:var(--display);font-weight:600;font-size:13px;fill:var(--ink);text-anchor:middle}
.elab.k-live rect{stroke:var(--live)} .elab.k-load rect{stroke:var(--load)} .elab.k-score rect{stroke:var(--score)} .elab.k-act rect{stroke:var(--act)} .elab.k-third rect{stroke:var(--third)}
@media (prefers-reduced-motion: reduce){.node rect.box{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2026 gym tech stack</h1>
  </header>

  <div class="chips" role="group" aria-label="Member action">
    <span class="lab">Members</span>
    <span class="chips" id="chips"></span>
  </div>

  <div class="main">
    <section class="diagram" aria-label="Technology stack diagram">
      <div class="dtop">
        <div class="seg" role="group" aria-label="Diagram view">
          <button type="button" id="vAll" aria-pressed="true">Full path</button>
          <button type="button" id="vFocus" aria-pressed="false">Current hop only</button>
        </div>
      </div>
      <div class="scroll"><svg class="map" id="map" viewBox="0 0 1200 690" role="img" aria-labelledby="mapdesc"><desc id="mapdesc">Five layers of a gym technology stack, from the system of record at the bottom to data and decisions at the top, with third-party data on the right. The current hop is described in the step panel and in the text version below.</desc></svg></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--live)"></i>Live request or event</span>
        <span><i class="sw" style="background:var(--load)"></i>Data load into the warehouse</span>
        <span><i class="sw" style="background:var(--score)"></i>Analysis and scoring</span>
        <span><i class="sw" style="background:var(--act)"></i>Action sent back to a tool</span>
        <span><i class="sw" style="background:var(--third)"></i>Third-party data in</span>
        <span><i class="sw dash"></i>Person acts or approves</span>
      </div>
    </section>

    <aside class="panel">
      <div class="meta"><span class="count" id="count" aria-live="polite"></span><span class="kind" id="kind"></span></div>
      <h2 id="title"></h2>
      <div class="route" id="route"></div>
      <div class="facts" id="facts"></div>
      <p class="body" id="body"></p>
      <p class="value"><span class="vl">What this layer adds</span><span id="value"></span></p>
      <div class="branch" id="branch" hidden>
        <span class="vl" id="branchq"></span>
        <div class="seg" id="branchseg" role="group" aria-label="Choose a path"></div>
      </div>
      <div class="controls">
        <button class="btn" id="back" type="button">Back</button>
        <button class="btn primary" id="play" type="button">Play</button>
        <button class="btn" id="next" type="button">Next</button>
      </div>
      <div class="dots" id="dots" role="group" aria-label="Steps"></div>
      <div class="recs" id="recs"></div>
    </aside>
  </div>

  <details class="text" id="textv">
    <summary>Text version of this flow</summary>
    <ol id="textlist"></ol>
  </details>
</div>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const LAYERS=[
  {n:5,name:'DATA & DECISIONS',blurb:'Combines the sources, scores members and clubs, recommends actions',top:20},
  {n:4,name:'OPERATIONS',blurb:'Staff, and the systems that hire, schedule, pay and direct them',top:150},
  {n:3,name:'MEMBER EXPERIENCE',blurb:'What members and guests touch in the club and the app',top:280},
  {n:2,name:'REVENUE ENGINE',blurb:'Turns ads and site visits into leads and joins, then keeps members in touch',top:410},
  {n:1,name:'CORE PLATFORM',blurb:'System of record: who is a member, what they owe, whether they can get in',top:540}
];
const N={
  actor:{x:90,y:470,actor:true,name:'Prospect or member',l:['Prospect','or member']},
  emp:{x:90,y:196,actor:true,name:'Employee or candidate',l:['Employee','or candidate']},
  dash:{x:290,y:92,l:['Dashboards','& reporting']},
  ai:{x:500,y:92,l:['AI agents'],adv:1},
  model:{x:710,y:92,l:['Models','& scores'],adv:1},
  wh:{x:900,y:92,l:['Data','warehouse'],adv:1},
  staff:{x:268,y:222,w:144,l:['Scheduling, tasks','& time clock']},
  desk:{x:434,y:222,w:144,l:['Front desk','& club team']},
  hr:{x:600,y:222,w:144,l:['HR, recruiting','& payroll']},
  fac:{x:766,y:222,w:144,l:['Maintenance','tickets']},
  fin:{x:932,y:222,w:144,l:['Finance','& accounting']},
  app:{x:290,y:352,l:['Member app']},
  book:{x:500,y:352,l:['Class booking']},
  fb:{x:710,y:352,l:['Feedback','& surveys']},
  tablet:{x:900,y:352,l:['Club sales','tablet']},
  web:{x:290,y:482,l:['Website','& join flow']},
  ads:{x:500,y:482,l:['Ad platforms']},
  crm:{x:710,y:482,l:['CRM & lead','management']},
  tags:{x:900,y:482,l:['Web analytics','& tags']},
  cms:{x:290,y:612,l:['Club management','& billing']},
  pay:{x:500,y:612,l:['Payment processor','& vault']},
  access:{x:710,y:612,l:['Door access']},
  coll:{x:900,y:612,l:['Collections','agency']},
  tloc:{x:1105,y:102,l:['Foot-traffic','panel'],adv:1,tp:1},
  tgeo:{x:1105,y:182,l:['Area','demographics'],adv:1,tp:1},
  tbench:{x:1105,y:262,l:['Public reviews','& benchmarks'],adv:1,tp:1}
};
const NAME=k=>N[k].name||N[k].l.join(' ');
const KIND={live:'Live request or event',load:'Data load',score:'Analysis & scoring',act:'Action sent back',third:'Third-party data'};
const TYPE={o:'Observed',e:'Estimated',p:'Predicted'};
const GROUPS=[['m','Person & account','member, guest or employee'],['e','Events & transactions','things that happened, when'],['a','Club, class & market','aggregates, not one person'],['p','Predictions & actions','scores and what was done']];

// step: [from,to,kind,title,body,value,how,when,who('a'|'s'),adds[[group,field,value,type,src]], par]
const A='a',Sf='s';
const SC=[
 {key:'join',label:'Joins online',steps:[
  ['actor','ads','live','Taps an ad','A prospect who lives seven minutes from the club taps a paid social ad.','The ad platform logs the impression, the click and the campaign. The person is still anonymous, so the click is stored under an ad click ID with no member ID attached.','Ad click','Seconds',A,[['e','ad_click','Fall promo, paid social','o','ads'],['e','click_id','clk_88231 (anonymous)','o','ads']]],
  ['ads','web','live','Lands on the join page','The click arrives with its click ID and campaign tags in the web address.','If the join flow keeps the click ID through checkout, the warehouse can later credit the join to the ad that produced it.','Link parameters','Seconds',A,[['e','landing_page','/join, utm_source=paid_social','o','web']]],
  ['web','tags','live','Form steps recorded','Analytics tags log the page view and each step of the join form.','Because each step is logged, the marketing team can see where prospects drop out: plan selection, the payment page or the contract.','Browser tag','Seconds',A,[['e','form_progress','plan picked, payment page reached','o','tags']],1],
  ['web','cms','live','Agreement signed','The prospect chooses the premium tier, signs a 12-month agreement and enters bank details.','The club management system creates the member, the contract and the dues schedule, and every later report draws on this record. No money has moved yet.','API call','Seconds',A,[['m','member_id','M-204817','o','cms'],['m','plan','Premium, 12-month term','o','cms'],['m','monthly_dues','$59.99','o','cms'],['m','home_club','Club 14','o','cms'],['e','agreement','signed Oct 13, 7:12 pm','o','cms']]],
  ['web','pay','live','Bank details go to the vault','The account number goes straight to the payment processor’s vault, which returns a token in its place.','Because the club system and the warehouse hold only the token, most of the security burden for bank data stays with the processor.','Secure payment form','Seconds',A,[['m','payment_ref','tok_ach_5521 (token only)','o','pay']],1],
  ['cms','pay','live','Initial payment submitted','The enrollment fee ($79) and first month ($59.99) are submitted as an ACH bank debit.','ACH debits stay pending for several business days, and the bank can return one during that window for insufficient funds, a closed account or a disputed debit.','API call','Seconds',A,[['e','initial_payment','$138.99 submitted, pending','o','pay']]],
  ['tags','ads','live','Join reported to the ad platform','The confirmation page reports a conversion. Advanced setups also send a server-side confirmation from the club system and remove duplicates.','The ad platform uses reported conversions to decide whom to bid on. The operator chooses which value to report; here it is the $138.99 initial payment rather than a lifetime estimate.','Browser tag (optional server-side)','Seconds',A,[['e','conversion','join, value $138.99 initial payment','o','tags']]],
  ['cms','crm','live','Welcome series starts','The new member syncs to the CRM, which starts a welcome series.','Onboarding messages go out in the first weeks of membership, when many early cancellations happen.','Webhook or sync','Minutes',A,[['p','journey','new member welcome, day 0','o','crm']]],
  ['pay','cms','live','Payment settles','Three business days later, the processor confirms that the debit settled.','The payment counts as collected only once it settles. Had the bank returned it, the member would have entered the missed-payment flow.','Webhook','2–4 business days',A,[['e','initial_payment','$138.99 settled Oct 16','o','pay']]],
  ['pay','fin','live','Deposit reconciled','Finance matches the processor’s deposit to the club system’s transactions.','Finance books processor fees and returns against each deposit before the figures reach the P&amp;L.','Settlement file','Daily',A,[['e','reconciled','deposit Oct 16, matched','o','fin']]],
  ['cms','wh','load','Copied to the warehouse','Member, contract and payment records are copied into the warehouse alongside ad and web data.','Refresh schedules vary by platform, from every few minutes to once a night. The warehouse is the one place where club, ad and web data share tables.','Scheduled or streaming sync','Minutes to overnight',A,[]],
  ['tags','wh','load','Identity matched','The warehouse links the anonymous click ID to M-204817 through the email address entered on the join form.','Ad clicks and web visits have no member ID of their own, and until the warehouse matches them, marketing spend can’t be tied to members.','Identity matching','Overnight',A,[['m','linked_ids','clk_88231 → M-204817','o','wh']]],

const svg=document.getElementById('map');
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const defs=el('defs',{},svg);
['live','load','score','act','third','future'].forEach(k=>{const m=el('marker',{id:'mk-'+k,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);el('path',{d:'M0,0 L10,5 L0,10 z',class:'mk-'+k},m);});

const gBands=el('g',{},svg), gEdges=el('g',{},svg), gNodes=el('g',{},svg), gLab=el('g',{},svg), gPk=el('g',{},svg);
LAYERS.forEach(L=>{
  el('rect',{x:180,y:L.top,width:832,height:120,rx:10,class:'band'},gBands);
  const t=el('text',{x:194,y:L.top+20},gBands);
  const a=el('tspan',{class:'bandnum'},t);a.textContent=L.n+'  '+L.name;
  const b=el('tspan',{class:'bandblurb',dx:12},t);b.textContent=L.blurb;
});
el('rect',{x:1025,y:20,width:162,height:290,rx:10,class:'tpbox'},gBands);
const th=el('text',{x:1106,y:44,class:'tphead','text-anchor':'middle'},gBands);th.textContent='THIRD-PARTY DATA';
const ts=el('text',{x:1106,y:62,class:'tpsub','text-anchor':'middle'},gBands);ts.textContent='optional market intelligence';

const nodeEls={},HW={},HH={};
for(const k in N){
  const n=N[k];
  if(n.actor){
    const g=el('g',{class:'actor'},gNodes);
    el('circle',{cx:n.x,cy:n.y,r:36,class:'bg'},g);
    el('circle',{cx:n.x,cy:n.y-11,r:9,class:'fig'},g);
    el('path',{d:`M${n.x-16},${n.y+20} Q${n.x-16},${n.y+1} ${n.x},${n.y+1} Q${n.x+16},${n.y+1} ${n.x+16},${n.y+20} Z`,class:'fig'},g);
    const t1=el('text',{x:n.x,y:n.y+58},g);t1.textContent=n.l[0];
    const t2=el('text',{x:n.x,y:n.y+76},g);t2.textContent=n.l[1];
    nodeEls[k]=g;HW[k]=40;HH[k]=40;continue;
  }
  const w=n.w||156,h=50;HW[k]=w/2+3;HH[k]=h/2+3;
  const g=el('g',{class:'node'},gNodes);
  el('rect',{x:n.x-w/2,y:n.y-h/2,width:w,height:h,rx:8,class:'box'},g);
  if(n.l.length===1){const t=el('text',{x:n.x,y:n.y+5,class:'lbl'},g);t.textContent=n.l[0];}
  else{const t=el('text',{x:n.x,y:n.y-3,class:'lbl'},g);t.textContent=n.l[0];const u=el('text',{x:n.x,y:n.y+15,class:'lbl'},g);u.textContent=n.l[1];}
  nodeEls[k]=g;
}
const halo=el('circle',{r:15,class:'pk halo',cx:-50,cy:-50},gPk);
const pk=el('circle',{r:7,class:'pk',cx:-50,cy:-50},gPk);

function clip(k,cx,cy){const n=N[k];let ux=cx-n.x,uy=cy-n.y;const L=Math.hypot(ux,uy)||1;ux/=L;uy/=L;const s=Math.min(ux?HW[k]/Math.abs(ux):1e9,uy?HH[k]/Math.abs(uy):1e9);return [n.x+ux*s,n.y+uy*s];}
function geom(a,b,i){
  const A_=N[a],B=N[b];const dx=B.x-A_.x,dy=B.y-A_.y,len=Math.hypot(dx,dy)||1;
  const off=Math.min(70,len*0.2)*(i%2?-1:1);const nx=-dy/len,ny=dx/len;
  const cx=(A_.x+B.x)/2+nx*off,cy=(A_.y+B.y)/2+ny*off;
  const s=clip(a,cx,cy),e=clip(b,cx,cy);
  const mx=.25*s[0]+.5*cx+.25*e[0],my=.25*s[1]+.5*cy+.25*e[1];
  return {d:`M${s[0]},${s[1]} Q${cx},${cy} ${e[0]},${e[1]}`,mx,my};
}

let sc=0,br=0,st=0,timer=null,raf=null,focus=false,edgeEls=[],geo=[];
const steps=()=>{const s=SC[sc];return s.branches?s.steps.concat(s.branches[br].steps):s.steps;};
const $=id=>document.getElementById(id);
const chips=$('chips');
SC.forEach((s,i)=>{if(s.emp&&!SC[i-1].emp){const l=document.createElement('span');l.className='lab';l.style.marginLeft='12px';l.textContent='Employees';chips.appendChild(l);}const b=document.createElement('button');b.className='chip';b.type='button';b.id='sc-'+s.key;b.textContent=s.label;b.addEventListener('click',()=>{stop();sc=i;br=0;st=0;build();});chips.appendChild(b);});

function build(){
  [...chips.querySelectorAll('.chip')].forEach((b,i)=>b.setAttribute('aria-pressed',i===sc?'true':'false'));
  const S=steps();
  gEdges.textContent='';geo=S.map((s,i)=>geom(s[0],s[1],i));
  edgeEls=S.map((s,i)=>el('path',{d:geo[i].d},gEdges));
  const dots=$('dots');dots.textContent='';
  S.forEach((s,i)=>{const d=document.createElement('button');d.type='button';d.className='dot';d.setAttribute('aria-label','Step '+(i+1)+': '+s[3]);d.appendChild(document.createElement('i'));d.addEventListener('click',()=>{stop();st=i;render(true);});dots.appendChild(d);});
  // branch selector
  const s=SC[sc],bw=$('branch');
  if(s.branches){$('branchq').textContent=s.q;const seg=$('branchseg');seg.textContent='';s.branches.forEach((b,i)=>{const x=document.createElement('button');x.type='button';x.textContent=b.label;x.setAttribute('aria-pressed',i===br?'true':'false');x.addEventListener('click',()=>{stop();br=i;if(st>=s.steps.length)st=s.steps.length;build();});seg.appendChild(x);});}
  // text version
  const ol=$('textlist');ol.textContent='';
  S.forEach(x=>{const li=document.createElement('li');li.append(document.createTextNode(x[3]+'. '));const sp=document.createElement('span');sp.textContent=NAME(x[0])+' → '+NAME(x[1])+' · '+KIND[x[2]]+' · '+x[6]+' · '+x[7]+(x[8]===Sf?' · staff':' · automatic');li.appendChild(sp);ol.appendChild(li);});
  $('textv').querySelector('summary').textContent='Text version of this flow: '+s.label+(s.branches?' ('+s.branches[br].label.toLowerCase()+')':'');
  render(true);
}

function render(animate){
  const S=steps(),s=S[st],kind=s[2];
  edgeEls.forEach((e,i)=>{const k=S[i][2],staff=S[i][8]===Sf?' staff':'';
    const state=i<st?'past k-'+k:i===st?'active k-'+k:'future';
    e.setAttribute('class','edge '+state+staff+(focus&&i!==st?' hide':''));
    e.setAttribute('marker-end','url(#mk-'+(i<=st?k:'future')+')');});
  gEdges.appendChild(edgeEls[st]);
  const touched=new Set();for(let i=0;i<st;i++){touched.add(S[i][0]);touched.add(S[i][1]);}
  for(const k in nodeEls){let c=N[k].actor?'actor':'node';if(touched.has(k)&&!focus)c+=' touched';if(k===s[0]||k===s[1])c+=' on k-'+kind;nodeEls[k].setAttribute('class',c);}
  // edge label
  gLab.textContent='';const g=geo[st];const lab=s[7]+(s[8]===Sf?' · staff':'');
  const gl=el('g',{class:'elab k-'+kind},gLab);const tw=lab.length*6.6+18;
  el('rect',{x:g.mx-tw/2,y:g.my-12,width:tw,height:22,rx:11},gl);const tt=el('text',{x:g.mx,y:g.my+4},gl);tt.textContent=lab;
  pk.setAttribute('class','pk k-'+kind);halo.setAttribute('class','pk halo k-'+kind);
  movePacket(edgeEls[st],animate);
  // panel
  $('count').textContent='Step '+(st+1)+' of '+S.length;
  const kb=$('kind');kb.className='kind '+kind;kb.textContent=KIND[kind];
  $('title').textContent=s[3];
  $('route').innerHTML='';const b1=document.createElement('b');b1.textContent=NAME(s[0]);const b2=document.createElement('b');b2.textContent=NAME(s[1]);$('route').append(b1,document.createTextNode(' → '),b2);
  const f=$('facts');f.textContent='';
  const fact=(l,v,c)=>{const d=document.createElement('span');d.className='fact'+(c?' '+c:'');if(l){const bb=document.createElement('b');bb.textContent=l;d.appendChild(bb);}d.appendChild(document.createTextNode(v));f.appendChild(d);};
  fact('How',' '+s[6]);fact('When',' '+s[7]);fact('',s[8]===Sf?'Person acts or approves':'Automatic',s[8]===Sf?'staff':'');if(s[10])fact('','In parallel with the previous step');
  $('body').textContent=s[4];
  $('value').innerHTML=s[5];
  // records
  const rec={},fresh=new Set();for(let i=0;i<=st;i++)S[i][9].forEach(r=>{rec[r[0]+'|'+r[1]]=r;if(i===st)fresh.add(r[0]+'|'+r[1]);});
  const box=$('recs');box.textContent='';
  const hd=document.createElement('span');hd.className='vl';hd.textContent='What the systems know so far';box.appendChild(hd);
  GROUPS.forEach(([gk,gn,gs])=>{const rows=Object.values(rec).filter(r=>r[0]===gk);
    const grp=document.createElement('div');grp.className='grp';const h=document.createElement('h3');h.textContent=gn;const hs=document.createElement('span');hs.textContent=gs;h.appendChild(hs);grp.appendChild(h);
    const rw=document.createElement('div');rw.className='rows';
    if(!rows.length){const n=document.createElement('div');n.className='none';n.textContent='Nothing yet';rw.appendChild(n);}
    rows.forEach(r=>{const d=document.createElement('div');d.className='row'+(fresh.has(r[0]+'|'+r[1])?' new':'');
      const top=document.createElement('div');top.className='rtop';const k=document.createElement('span');k.className='rk';k.textContent=r[1];const tg=document.createElement('span');tg.className='tag '+r[3];tg.textContent=TYPE[r[3]];top.append(k,tg);
      const v=document.createElement('div');v.className='rv';v.textContent=r[2];const src=document.createElement('div');src.className='rs';src.textContent='Owned by: '+NAME(r[4]);
      d.append(top,v,src);rw.appendChild(d);});
    grp.appendChild(rw);box.appendChild(grp);});
  [...$('dots').children].forEach((d,i)=>{d.className='dot'+(i<st?' done':'');if(i===st)d.setAttribute('aria-current','step');else d.removeAttribute('aria-current');});
  {const sc_=SC[sc];$('branch').hidden=!(sc_.branches&&st>=sc_.steps.length-1);}
  $('back').disabled=st===0;$('next').disabled=st===S.length-1;
}

const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function movePacket(path,animate){
  cancelAnimationFrame(raf);const L=path.getTotalLength();
  const put=t=>{const p=path.getPointAtLength(L*t);pk.setAttribute('cx',p.x);pk.setAttribute('cy',p.y);halo.setAttribute('cx',p.x);halo.setAttribute('cy',p.y);};
  if(!animate||reduce){put(1);return;}
  const t0=performance.now(),D=1100;
  const f=now=>{let t=Math.min(1,(now-t0)/D);t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;put(t);if(t<1)raf=requestAnimationFrame(f);};
  raf=requestAnimationFrame(f);
}
function step(d){st=Math.max(0,Math.min(steps().length-1,st+d));render(true);}
function stop(){clearInterval(timer);timer=null;$('play').textContent='Play';}
$('back').addEventListener('click',()=>{stop();step(-1);});
$('next').addEventListener('click',()=>{stop();step(1);});
$('play').addEventListener('click',()=>{
  if(timer){stop();return;}
  if(st===steps().length-1){st=0;render(true);}
  $('play').textContent='Pause';
  timer=setInterval(()=>{if(st>=steps().length-1){stop();return;}step(1);},7000);
});
const setView=v=>{focus=v;$('vAll').setAttribute('aria-pressed',v?'false':'true');$('vFocus').setAttribute('aria-pressed',v?'true':'false');render(false);};
$('vAll').addEventListener('click',()=>setView(false));
$('vFocus').addEventListener('click',()=>setView(true));
build();
})();
